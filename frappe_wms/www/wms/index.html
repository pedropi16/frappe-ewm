<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>WMS Scanner</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1f232c;
    --border: #2a2f3a;
    --text: #f1f3f6;
    --muted: #8b93a3;
    --accent: #3d7dfa;
    --accent-text: #ffffff;
    --danger: #e5484d;
    --warn: #d9a441;
    --ok: #2fb35c;
    --radius: 10px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100%; overscroll-behavior-y: contain; }
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  header { display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
    flex: 0 0 auto; gap: 10px; }
  header .title-wrap { min-width: 0; }
  header .title { font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .user { font-size: 12px; color: var(--muted); }
  header .home-btn { background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 8px 12px; font-size: 14px; font-weight: 600; flex: 0 0 auto; }
  header .home-btn-secondary { background: transparent; color: var(--muted); font-weight: 500; }

  main { flex: 1 1 auto; overflow-y: auto; padding: 12px; }

  .banner { padding: 12px 14px; border-radius: var(--radius); margin-bottom: 12px; font-size: 14px; }
  .banner.error { background: rgba(229,72,77,0.15); border: 1px solid var(--danger); color: #ffb3b5; }
  .banner.ok { background: rgba(47,179,92,0.15); border: 1px solid var(--ok); color: #a9e8bb; }

  .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .menu-btn { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px 10px; text-align: center; font-size: 15px; font-weight: 700; }
  .menu-btn:active { background: var(--panel-2); }
  .menu-btn .icon { font-size: 24px; display: block; margin-bottom: 6px; }
  .menu-btn .count { display: inline-block; margin-top: 6px; font-size: 12px; font-weight: 700;
    color: var(--accent-text); background: var(--accent); border-radius: 999px; padding: 2px 8px; }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px; margin-bottom: 10px; }
  .card:active { background: var(--panel-2); }
  .card .row1 { display: flex; justify-content: space-between; align-items: center; }
  .card .task-type { font-weight: 700; font-size: 16px; }
  .badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; text-transform: uppercase; }
  .badge.Low { background: #2a2f3a; color: var(--muted); }
  .badge.Normal { background: #23324d; color: #9cc2ff; }
  .badge.High { background: #4d3a1f; color: var(--warn); }
  .badge.Urgent { background: #4d1f24; color: var(--danger); }
  .card .meta { color: var(--muted); font-size: 13px; margin-top: 6px; line-height: 1.5; }
  .card .qty { font-size: 13px; margin-top: 4px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 14px; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; }
  .field input, .field select { width: 100%; font-size: 18px; padding: 12px 14px; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text); }
  .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
  .field .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .btn { display: block; width: 100%; padding: 16px; font-size: 16px; font-weight: 700; border-radius: var(--radius);
    border: none; margin-bottom: 10px; }
  .btn-primary { background: var(--accent); color: var(--accent-text); }
  .btn-secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: rgba(229,72,77,0.15); color: #ffb3b5; border: 1px solid var(--danger); }
  .btn:disabled { opacity: .5; }

  .detail-section { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px; margin-bottom: 14px; }
  .detail-section h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .detail-section + .detail-section { margin-top: -4px; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 14px; }
  .detail-grid .label { color: var(--muted); }

  .line-row { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 10px; }
  .line-row:first-child { border-top: none; padding-top: 0; margin-top: 0; }
  .line-row .line-head { font-weight: 700; margin-bottom: 8px; }
  .line-row .line-sub { color: var(--muted); font-size: 12px; margin-bottom: 8px; }

  table.result { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.result th, table.result td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--border); }
  table.result th { color: var(--muted); font-weight: 600; }

  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3);
    border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center;
    justify-content: center; z-index: 50; }
</style>
</head>
<body>
<div id="app"></div>

<script>
const CSRF_TOKEN = "{{ csrf_token }}";
const USER_FULLNAME = {{ (user_fullname or "") | tojson }};

async function api(method, args) {
  const res = await fetch(`/api/method/${method}`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Frappe-CSRF-Token": CSRF_TOKEN },
    body: JSON.stringify(args || {}),
  });
  let data = {};
  try { data = await res.json(); } catch (e) { /* no body */ }
  if (!res.ok) {
    const msg = (data && data._server_messages) ? extractServerMessage(data._server_messages)
      : (data && data.exception) || `Request failed (${res.status})`;
    throw new Error(msg);
  }
  return data.message;
}

function extractServerMessage(raw) {
  try {
    const list = JSON.parse(raw);
    const first = JSON.parse(list[0]);
    return first.message || raw;
  } catch (e) { return raw; }
}

function uid() { return Math.random().toString(36).slice(2, 10); }
function flt(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }

const TASK_TYPE_GROUPS = {
  inbound: ["Unload", "Putaway"],
  internal: ["Internal Move", "Posting Change", "Inventory Count"],
  outbound: ["Pick", "Stage", "Load"],
};

const SECTIONS = {
  inbound: {
    label: "Inbound", icon: "\u{1F4E5}",
    items: [
      { icon: "\u{1F4E5}", label: "Receive", action: loadInboundDeliveries },
      { icon: "\u{1F4CB}", label: "Putaway Tasks", taskGroup: "inbound", action: () => openTasksFiltered("inbound") },
      { icon: "\u{2705}", label: "Quality", action: loadInspections },
    ],
  },
  internal: {
    label: "Internal", icon: "\u{2194}\u{FE0F}",
    items: [
      { icon: "\u{2194}\u{FE0F}", label: "Move", action: openMove },
      { icon: "\u{1F4CB}", label: "Internal Tasks", taskGroup: "internal", action: () => openTasksFiltered("internal") },
      { icon: "\u{1F522}", label: "Count", action: loadCounts },
      { icon: "\u{1F3F7}\u{FE0F}", label: "Handling Units", action: loadHUHome },
    ],
  },
  outbound: {
    label: "Outbound", icon: "\u{1F4E4}",
    items: [
      { icon: "\u{1F4CB}", label: "Pick Tasks", taskGroup: "outbound", action: () => openTasksFiltered("outbound") },
      { icon: "\u{1F4E4}", label: "Ship", action: loadShipDeliveries },
      { icon: "\u{1F4E6}", label: "Pack", action: loadPackingOrders },
      { icon: "\u{1F69B}", label: "Load", action: loadShipments },
    ],
  },
};

// Maps a view to the view it should return to when the header Back button is pressed.
const VIEW_PARENT = {
  section: () => "menu",
  tasks: () => "section",
  "task-detail": () => "tasks",
  receive: () => "section",
  "receive-detail": () => "receive",
  ship: () => "section",
  "ship-detail": () => "ship",
  pack: () => "section",
  move: () => "section",
  count: () => "section",
  "count-detail": () => "count",
  quality: () => "section",
  "quality-detail": () => "quality",
  hu: () => "section",
  "hu-detail": () => "hu",
  load: () => "section",
  "load-detail": () => "load",
  lookup: () => "menu",
};

// Reloads the list for a view when navigating back into it, so data is never stale.
const VIEW_RELOAD = {
  tasks: loadTasks, receive: loadInboundDeliveries, ship: loadShipDeliveries,
  pack: loadPackingOrders, count: loadCounts, quality: loadInspections, hu: loadHUHome,
  load: loadShipments,
};

const state = {
  view: "menu",
  section: null,
  loading: false,
  error: null,
  info: null,
  resource: null,
  hu_types: [],

  // Tasks
  tasks: [],
  taskTypeFilter: null,
  availableQueues: [],
  showQueuePicker: false,
  currentTask: null,
  scanSource: "",
  scanDestination: "",
  confirmQty: "",
  exceptionCodes: [],
  exceptionCodesLoaded: false,
  exceptionRemarks: "",

  // Handling Units
  huList: [],
  huSearch: "",
  currentHU: null,
  huNestTarget: "",
  newHU: { hu_number: "", hu_type: "", storage_bin: "", parent_hu: "" },

  // Load / Shipments
  shipments: [],
  currentShipment: null,

  // Lookup
  lookupCode: "",
  lookupType: "hu",
  lookupResult: null,

  // Receive
  inboundDeliveries: [],
  currentInbound: null,
  receiveLines: [],

  // Ship
  shipDeliveries: [],
  currentShipDelivery: null,
  shipLines: [],

  // Pack
  packingOrders: [],

  // Move
  moveForm: { product: "", quantity: "", stock_uom: "", stock_type: "AVAILABLE", source_bin: "", source_hu: "", destination_bin: "", destination_hu: "" },

  // Count
  counts: [],
  currentCount: null,

  // Quality
  inspections: [],
  currentInspection: null,
};

function setState(patch) { Object.assign(state, patch); render(); }

function goHome() {
  setState({ view: "menu", section: null, error: null, info: null, currentTask: null, currentInbound: null, currentShipDelivery: null, currentCount: null, currentInspection: null, currentHU: null, taskTypeFilter: null });
  loadResource();
}

function goSection(key) {
  setState({ view: "section", section: key, error: null, info: null });
}

function goBack() {
  const parentFn = VIEW_PARENT[state.view];
  if (!parentFn) { goHome(); return; }
  const parent = parentFn();
  setState({ view: parent, error: null, info: null });
  const reload = VIEW_RELOAD[parent];
  if (reload) reload();
}

function openTasksFiltered(group) {
  setState({ view: "tasks", section: group, taskTypeFilter: TASK_TYPE_GROUPS[group] || null, error: null, info: null });
  loadTasks();
}

async function loadResource() {
  try {
    const res = await api("frappe_wms.api.scanner.my_tasks");
    setState({ resource: res.resource || null, tasks: res.tasks || [] });
  } catch (e) { /* ignore on menu load */ }
}

// ---------- Tasks ----------
async function loadTasks() {
  setState({ loading: true, error: null });
  try {
    const res = await api("frappe_wms.api.scanner.my_tasks");
    setState({ loading: false, tasks: res.tasks || [], resource: res.resource || null });
  } catch (e) {
    setState({ loading: false, error: e.message });
  }
}

// ---------- Queues & Warehouse Orders ----------
async function openQueuePicker() {
  setState({ loading: true, error: null });
  try {
    const warehouse = state.resource ? state.resource.warehouse : undefined;
    const queues = await api("frappe_wms.api.warehouse_order.list_queues", { warehouse });
    setState({ loading: false, availableQueues: queues || [], showQueuePicker: true });
  } catch (e) {
    setState({ loading: false, error: e.message });
  }
}

async function pickQueue(queueName) {
  setState({ loading: true, error: null });
  try {
    await api("frappe_wms.api.warehouse_order.join_queue", { queue_name: queueName });
    setState({ loading: false, showQueuePicker: false, info: `Joined ${queueName}` });
    loadTasks();
  } catch (e) {
    setState({ loading: false, error: e.message });
  }
}

async function leaveCurrentQueue() {
  setState({ loading: true, error: null });
  try {
    await api("frappe_wms.api.warehouse_order.leave_queue", {});
    setState({ loading: false, info: "Left queue" });
    loadTasks();
  } catch (e) {
    setState({ loading: false, error: e.message });
  }
}

async function pullWork() {
  setState({ loading: true, error: null });
  try {
    const wo = await api("frappe_wms.api.warehouse_order.pull_next_warehouse_order", {});
    setState({ loading: false, info: wo ? `Assigned ${wo}` : "No work waiting in this queue" });
    loadTasks();
  } catch (e) {
    setState({ loading: false, error: e.message });
  }
}

function openTask(task) {
  setState({
    view: "task-detail", currentTask: task, scanSource: "", scanDestination: "",
    confirmQty: String(flt(task.planned_quantity) - flt(task.confirmed_quantity)),
    error: null, info: null, exceptionCodes: [], exceptionCodesLoaded: false, exceptionRemarks: "",
  });
}

async function confirmCurrentTask() {
  const task = state.currentTask;
  setState({ loading: true, error: null });
  try {
    const result = await api("frappe_wms.api.scanner.confirm_task", {
      task_name: task.name,
      scanned_source: state.scanSource || undefined,
      scanned_destination: state.scanDestination || undefined,
      confirmed_quantity: state.confirmQty,
      idempotency_key: `${task.name}:${task.confirmed_quantity}:${uid()}`,
    });
    setState({ loading: false, view: "tasks", info: `${task.task_type} ${result.status.toLowerCase()} (${result.quantity})`, currentTask: null });
    loadTasks();
  } catch (e) {
    setState({ loading: false, error: e.message });
  }
}

async function openExceptionPicker() {
  setState({ loading: true, error: null });
  try {
    const codes = await api("frappe_wms.api.scanner.list_exception_codes", { task_type: state.currentTask.task_type });
    setState({ loading: false, exceptionCodes: codes, exceptionCodesLoaded: true, exceptionRemarks: "" });
  } catch (e) {
    setState({ loading: false, error: e.message });
  }
}

async function submitException(code) {
  const task = state.currentTask;
  const requiresComment = state.exceptionCodes.find((c) => c.name === code)?.requires_comment;
  const remarks = state.exceptionRemarks.trim();
  if (requiresComment && !remarks) {
    setState({ error: "This exception requires a comment before it can be reported." });
    return;
  }
  setState({ loading: true, error: null });
  try {
    await api("frappe_wms.api.scanner.raise_exception", { task_name: task.name, exception_code: code, remarks: remarks || undefined });
    setState({ loading: false, view: "tasks", info: `${task.task_type} flagged as exception`, currentTask: null, exceptionCodes: [], exceptionCodesLoaded: false, exceptionRemarks: "" });
    loadTasks();
  } catch (e) {
    setState({ loading: false, error: e.message });
  }
}

// ---------- Lookup ----------
async function runLookup() {
  if (!state.lookupCode) return;
  setState({ loading: true, error: null, lookupResult: null });
  try {
    const method = state.lookupType === "hu" ? "frappe_wms.api.scanner.hu_overview" : "frappe_wms.api.scanner.bin_overview";
    const args = state.lookupType === "hu" ? { hu_number: state.lookupCode } : { bin_code: state.lookupCode };
    const result = await api(method, args);
    setState({ loading: false, lookupResult: result });
  } catch (e) {
    setState({ loading: false, error: e.message });
  }
}

// ---------- Receive ----------
async function loadInboundDeliveries() {
  setState({ loading: true, error: null, view: "receive", section: "inbound" });
  try {
    const rows = await api("frappe_wms.api.inbound.list_open_inbound_deliveries");
    setState({ loading: false, inboundDeliveries: rows || [] });
  } catch (e) {
    setState({ loading: false, error: e.message });
  }
}

async function openInbound(delivery) {
  setState({ loading: true, error: null });
  try {
    if (!state.hu_types.length) await loadHuTypes();
    const doc = await api("frappe.client.get", { doctype: "Inbound Delivery", name: delivery.name });
    const lines = (doc.items || []).map((row) => ({
      inbound_delivery_item: row.name, item: row.item,
      remaining: flt(row.expected_quantity) - flt(row.received_quantity),
      stock_uom: row.stock_uom, stock_type: row.expected_stock_type,
      handling_unit: "", quantity: String(flt(row.expected_quantity) - flt(row.received_quantity)), hu_type: "",
    })).filter((l) => l.remaining > 0);
    setState({ loading: false, view: "receive-detail", currentInbound: delivery, receiveLines: lines });
  } catch (e) {
    setState({ loading: false, error: e.message });
  }
}

async function loadHuTypes() {
  try {
    const rows = await api("frappe.client.get_list", { doctype: "Handling Unit Type", fields: ["name", "numbering_mode"], limit_page_length: 50 });
    setState({ hu_types: rows || [] });
  } catch (e) { /* non-fatal */ }
}

function updateReceiveLine(i, field, value) {
  state.receiveLines[i][field] = value;
}

async function submitReceipt() {
  const delivery = state.currentInbound;
  const items = state.receiveLines
    .filter((l) => l.handling_unit && flt(l.quantity) > 0)
    .map((l) => ({
      inbound_delivery_item: l.inbound_delivery_item, item: l.item, quantity: flt(l.quantity),
      stock_uom: l.stock_uom, handling_unit: l.handling_unit, stock_type: l.stock_type, hu_type: l.hu_type || undefined,
    }));
  if (!items.length) { setState({ error: "Scan at least one Handling Unit with a quantity." }); return; }
  setState({ loading: true, error: null });
  try {
    const result = await api("frappe_wms.api.inbound.create_and_submit_goods_receipt", { inbound_delivery: delivery.name, items: JSON.stringify(items) });
    setState({ loading: false, view: "tasks", section: "inbound", taskTypeFilter: TASK_TYPE_GROUPS.inbound, info: `Goods Receipt ${result.goods_receipt} posted, ${result.warehouse_tasks.length} putaway task(s) created`, currentInbound: null, receiveLines: [] });
    loadTasks();
  } catch (e) {
    setState({ loading: false, error: e.message });
  }
}

// ---------- Ship ----------
async function loadShipDeliveries() {
  setState({ loading: true, error: null, view: "ship", section: "outbound" });
  try {
    const rows = await api("frappe_wms.api.outbound.list_ready_to_ship");
    setState({ loading: false, shipDeliveries: rows || [] });
  } catch (e) {
    setState({ loading: false, error: e.message });
  }
}

function openShipDelivery(delivery) {
  const lines = delivery.items.map((row) => ({
    outbound_delivery_item: row.name, item: row.item, remaining: row.remaining_quantity,
    stock_uom: row.stock_uom, stock_type: row.required_stock_type,
    handling_unit: row.suggested_handling_unit || "", quantity: String(row.remaining_quantity),
  }));
  setState({ view: "ship-detail", currentShipDelivery: delivery, shipLines: lines, error: null, info: null });
}

function updateShipLine(i, field, value) {
  state.shipLines[i][field] = value;
}

async function submitGoodsIssue() {
  const delivery = state.currentShipDelivery;
  const items = state.shipLines
    .filter((l) => l.handling_unit && flt(l.quantity) > 0)
    .map((l) => ({
      outbound_delivery_item: l.outbound_delivery_item, item: l.item, quantity: flt(l.quantity),
      stock_uom: l.stock_uom, handling_unit: l.handling_unit, stock_type: l.stock_type,
    }));
  if (!items.length) { setState({ error: "Enter the Handling Unit being shipped for at least one line." }); return; }
  setState({ loading: true, error: null });
  try {
    const result = await api("frappe_wms.api.outbound.create_and_submit_goods_issue", { outbound_delivery: delivery.name, items: JSON.stringify(items) });
    setState({ loading: false, view: "section", section: "outbound", info: `Goods Issue ${result.goods_issue} posted`, currentShipDelivery: null, shipLines: [] });
  } catch (e) {
    setState({ loading: false, error: e.message });
  }
}

// ---------- Pack ----------
async function loadPackingOrders() {
  setState({ loading: true, error: null, view: "pack", section: "outbound" });
  try {
    const rows = await api("frappe_wms.api.scanner.list_open_packing_orders");
    setState({ loading: false, packingOrders: rows || [] });
  } catch (e) {
    setState({ loading: false, error: e.message });
  }
}

async function completePacking(order) {
  setState({ loading: true, error: null });
  try {
    await api("frappe_wms.api.scanner.complete_packing_order", { packing_order_name: order.name });
    setState({ loading: false, info: `Packing order ${order.name} completed` });
    loadPackingOrders();
  } catch (e) {
    setState({ loading: false, error: e.message });
  }
}

// ---------- Move ----------
function openMove() {
  setState({
    view: "move", section: "internal", error: null, info: null,
    moveForm: { product: "", quantity: "", stock_uom: "", stock_type: "AVAILABLE",
      source_bin: "", source_hu: "", destination_bin: "", destination_hu: "" },
  });
}

async function submitMove() {
  const f = state.moveForm;
  if (!f.product || !flt(f.quantity) || !f.stock_uom || !f.destination_bin) {
    setState({ error: "Product, quantity, UOM and destination bin are required." });
    return;
  }
  if (!f.source_bin && !f.source_hu) {
    setState({ error: "Scan a source bin or a source Handling Unit." });
    return;
  }
  setState({ loading: true, error: null });
  try {
    const warehouse = state.resource ? state.resource.warehouse : f.warehouse;
    const result = await api("frappe_wms.api.scanner.create_and_confirm_move", {
      warehouse, product: f.product, quantity: flt(f.quantity), stock_uom: f.stock_uom, stock_type: f.stock_type,
      source_bin: f.source_bin || undefined, source_hu: f.source_hu || undefined,
      destination_bin: f.destination_bin, destination_hu: f.destination_hu || undefined,
    });
    setState({ loading: false, view: "section", section: "internal", info: `Moved ${result.quantity} ${f.product} to ${f.destination_bin}` });
  } catch (e) {
    setState({ loading: false, error: e.message });
  }
}

async function loadCounts() {
  setState({ loading: true, error: null, view: "count", section: "internal" });
  try {
    const rows = await api("frappe_wms.api.inventory.list_open_counts");
    setState({ loading: false, counts: rows || [] });
  } catch (e) {
    setState({ loading: false, error: e.message });
  }
}

function openCount(count) {
  const items = (count.items || []).map((row) => ({ ...row, counted_quantity: row.counted_quantity != null ? String(row.counted_quantity) : "" }));
  setState({ view: "count-detail", currentCount: count, currentCountItems: items, error: null, info: null });
}

function updateCountLine(i, value) {
  state.currentCountItems[i].counted_quantity = value;
}

async function submitCounts() {
  const count = state.currentCount;
  const counted = {};
  state.currentCountItems.forEach((row) => {
    if (row.counted_quantity !== "") counted[row.name] = flt(row.counted_quantity);
  });
  if (!Object.keys(counted).length) { setState({ error: "Enter at least one counted quantity." }); return; }
  setState({ loading: true, error: null });
  try {
    const result = await api("frappe_wms.api.inventory.record_counts", { count_name: count.name, counted_quantities: JSON.stringify(counted) });
    if (result.status === "Counted") {
      try {
        await api("frappe_wms.api.inventory.post_count", { count_name: count.name });
        setState({ loading: false, view: "section", section: "internal", info: `Count ${count.name} fully counted and posted` });
        return;
      } catch (e) {
        setState({ loading: false, view: "section", section: "internal", info: `Count ${count.name} fully counted; ask a supervisor to post it` });
        return;
      }
    }
    setState({ loading: false, view: "section", section: "internal", info: `Saved counts for ${count.name}` });
  } catch (e) {
    setState({ loading: false, error: e.message });
  }
}

async function loadInspections() {
  setState({ loading: true, error: null, view: "quality", section: state.section || "inbound" });
  try {
    const rows = await api("frappe_wms.api.inventory.list_open_inspections");
    setState({ loading: false, inspections: rows || [] });
  } catch (e) {
    setState({ loading: false, error: e.message });
  }
}

function openInspection(inspection) {
  setState({
    view: "quality-detail", currentInspection: inspection, error: null, info: null,
    qualityPassed: String(inspection.quantity), qualityFailed: "0",
  });
}

async function submitInspection() {
  const inspection = state.currentInspection;
  const passed = flt(state.qualityPassed), failed = flt(state.qualityFailed);
  if (Math.abs((passed + failed) - flt(inspection.quantity)) > 0.0001) {
    setState({ error: `Passed + failed must equal ${inspection.quantity}` });
    return;
  }
  setState({ loading: true, error: null });
  try {
    await api("frappe_wms.api.inventory.complete_inspection", { inspection_name: inspection.name, passed_quantity: passed, failed_quantity: failed });
    setState({ loading: false, view: "section", section: state.section || "inbound", info: `Inspection ${inspection.name} completed`, currentInspection: null });
  } catch (e) {
    setState({ loading: false, error: e.message });
  }
}

async function loadHUHome() {

    const rows = await api("frappe_wms.api.handling_unit.list_handling_units", { search: state.huSearch || undefined });

function searchHU(value) {

  loadHUHome();
}

function openHUCreate() {
  setState({ view: "hu-create", section: "internal", error: null, info: null, newHU: { hu_number: "", hu_type: "", storage_bin: "", parent_hu: "" } });
}

async function submitCreateHU() {
  const f = state.newHU;
  const huType = state.hu_types.find((t) => t.name === f.hu_type);
  const isInternal = huType && huType.numbering_mode === "Internal";
  if (!f.hu_type || (!isInternal && !f.hu_number) || (!f.storage_bin && !f.parent_hu)) {
    setState({ error: isInternal ? "Pick an HU type, and scan a bin or a parent HU." : "Scan a barcode, pick an HU type, and scan a bin or a parent HU." });
    return;
  }
  setState({ loading: true, error: null });
  try {
    const result = await api("frappe_wms.api.handling_unit.create_handling_unit", {
      hu_number: f.hu_number || undefined, hu_type: f.hu_type, storage_bin: f.storage_bin || undefined, parent_hu: f.parent_hu || undefined,
    });
    setState({ loading: false, view: "hu", info: `Handling Unit ${result.name} created` });
    loadHUHome();
  } catch (e) {
    setState({ loading: false, error: e.message });
  }
}

async function openHU(hu) {
  setState({ loading: true, error: null });
  try {
    const detail = await api("frappe_wms.api.handling_unit.handling_unit_detail", { hu_name: hu.name });
    setState({ loading: false, view: "hu-detail", currentHU: detail, huNestTarget: "" });
  } catch (e) {

}

async function refreshCurrentHU() {

  const detail = await api("frappe_wms.api.handling_unit.handling_unit_detail", { hu_name: state.currentHU.name });
  setState({ currentHU: detail });
}

async function submitNestHU() {
  const target = (state.huNestTarget || "").trim();
  if (!target) { setState({ error: "Scan the parent Handling Unit's barcode." }); return; }
  setState({ loading: true, error: null });
  try {
    await api("frappe_wms.api.handling_unit.nest_handling_unit", { hu_name: state.currentHU.name, parent_hu: target });
    setState({ loading: false, info: `Nested inside ${target}` });
    refreshCurrentHU();
  } catch (e) {
    setState({ loading: false, error: e.message });
  }
}

async function submitUnnestHU() {
  setState({ loading: true, error: null });
  try {
    await api("frappe_wms.api.handling_unit.unnest_handling_unit", { hu_name: state.currentHU.name });
    setState({ loading: false, info: "Unnested" });
    refreshCurrentHU();
  } catch (e) {
    setState({ loading: false, error: e.message });
  }
}

async function toggleBlockHU() {
  const hu = state.currentHU;
  const blocking = hu.status !== "Blocked";
  setState({ loading: true, error: null });
  try {
    const method = blocking ? "frappe_wms.api.handling_unit.block_handling_unit" : "frappe_wms.api.handling_unit.unblock_handling_unit";
    await api(method, { hu_name: hu.name });
    setState({ loading: false, info: blocking ? `${hu.name} blocked` : `${hu.name} unblocked` });
    refreshCurrentHU();
  } catch (e) {
    setState({ loading: false, error: e.message });

// ---------- Rendering ----------
function el(html) {
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstChild;
}

function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";
  app.appendChild(renderHeader());
  const main = el(`<main></main>`);
  if (state.error) main.appendChild(el(`<div class="banner error">${escapeHtml(state.error)}</div>`));
  if (state.info) main.appendChild(el(`<div class="banner ok">${escapeHtml(state.info)}</div>`));

  const renderers = {
    menu: renderMenu, section: renderSection, tasks: renderTasks, "task-detail": renderTaskDetail, lookup: renderLookup,
    receive: renderReceiveList, "receive-detail": renderReceiveDetail,
    ship: renderShipList, "ship-detail": renderShipDetail,
    pack: renderPackList, move: renderMove,
    count: renderCountList, "count-detail": renderCountDetail,
    quality: renderQualityList, "quality-detail": renderQualityDetail,
    hu: renderHUList, "hu-create": renderHUCreate, "hu-detail": renderHUDetail,
    load: renderLoadList, "load-detail": renderLoadDetail,
  };
  main.appendChild((renderers[state.view] || renderMenu)());

  app.appendChild(main);
  if (state.loading) app.appendChild(el(`<div class="overlay"><div class="spinner"></div></div>`));
}

function breadcrumb() {
  const section = state.section && SECTIONS[state.section];
  if (!section) return null;
  const VIEW_LABEL = {
    section: null, tasks: "Tasks", "task-detail": "Task", receive: "Receive", "receive-detail": "Receive",
    ship: "Ship", "ship-detail": "Ship", pack: "Pack", move: "Move", count: "Count", "count-detail": "Count",
    quality: "Quality", "quality-detail": "Quality", hu: "Handling Units", "hu-create": "New Handling Unit", "hu-detail": "Handling Unit",
    load: "Load", "load-detail": "Load",
  };
  const leaf = VIEW_LABEL[state.view];
  return `${section.icon} ${escapeHtml(section.label)}${leaf ? " &rsaquo; " + escapeHtml(leaf) : ""}`;
}

function renderHeader() {
  const crumb = breadcrumb();
  const header = el(`
    <header>
      <div class="title-wrap">
        <div class="title">${crumb || "WMS Scanner"}</div>
        <div class="user">${escapeHtml(USER_FULLNAME)}${state.resource ? " &middot; " + escapeHtml(state.resource.name) : ""}</div>
      </div>
    </header>
  `);
  if (state.view !== "menu") {
    const back = el(`<button class="home-btn">&larr; Back</button>`);
    back.onclick = goBack;
    header.appendChild(back);
  }
  if (state.view !== "menu" && state.view !== "section") {
    const home = el(`<button class="home-btn home-btn-secondary">Home</button>`);
    home.onclick = goHome;
    header.appendChild(home);
  }
  return header;
}

function renderMenu() {
  const wrap = el(`<div></div>`);
  const grid = el(`<div class="menu-grid"></div>`);
  const items = [
    ...Object.keys(SECTIONS).map((key) => ({ icon: SECTIONS[key].icon, label: SECTIONS[key].label, action: () => goSection(key) })),
    { icon: "\u{1F50D}", label: "Lookup", action: () => setState({ view: "lookup", section: null, error: null, info: null }) },
  ];
  items.forEach((item) => {
    const btn = el(`
      <div class="menu-btn">
        <span class="icon">${item.icon}</span>${escapeHtml(item.label)}
      </div>
    `);
    btn.onclick = item.action;
    grid.appendChild(btn);
  });
  wrap.appendChild(grid);
  return wrap;
}

function renderSection() {
  const section = SECTIONS[state.section];
  const wrap = el(`<div></div>`);
  if (!section) { goHome(); return wrap; }
  const grid = el(`<div class="menu-grid"></div>`);
  section.items.forEach((item) => {
    const count = item.taskGroup ? state.tasks.filter((t) => TASK_TYPE_GROUPS[item.taskGroup].includes(t.task_type)).length : 0;
    const btn = el(`
      <div class="menu-btn">
        <span class="icon">${item.icon}</span>${escapeHtml(item.label)}
        ${count ? `<div class="count">${count}</div>` : ""}
      </div>
    `);
    btn.onclick = item.action;
    grid.appendChild(btn);
  });
  wrap.appendChild(grid);
  return wrap;
}

// ----- Tasks -----
function taskCard(task) {
  const card = el(`
    <div class="card">
      <div class="row1">
        <div class="task-type">${escapeHtml(task.task_type)}</div>
        <span class="badge ${escapeHtml(task.priority)}">${escapeHtml(task.priority)}</span>
      </div>
      <div class="meta">
        ${escapeHtml(task.product || "")}<br>
        ${escapeHtml(task.source_bin || task.source_hu || "-")} &rarr; ${escapeHtml(task.destination_bin || task.destination_hu || "-")}
      </div>
      <div class="qty">${task.confirmed_quantity || 0} / ${task.planned_quantity} ${escapeHtml(task.stock_uom || "")}${task.wave ? " &middot; " + escapeHtml(task.wave) : ""}</div>
    </div>
  `);
  card.onclick = () => openTask(task);
  return card;
}

function renderQueueBar() {
  const bar = el(`<div class="detail-section"></div>`);
  const resource = state.resource;
  const queue = resource && resource.current_queue;
  bar.appendChild(el(`<h3>Queue</h3>`));
  const row = el(`<div class="row1"></div>`);
  row.appendChild(el(`<div>${queue ? "\u{1F4E1} " + escapeHtml(queue) : "Not joined to a queue"}</div>`));
  const actions = el(`<div></div>`);
  if (queue) {
    const pullBtn = el(`<button class="btn btn-secondary">Get Work</button>`);
    pullBtn.onclick = pullWork;
    actions.appendChild(pullBtn);
    const leaveBtn = el(`<button class="btn btn-secondary">Leave</button>`);
    leaveBtn.onclick = leaveCurrentQueue;
    actions.appendChild(leaveBtn);
  } else {
    const joinBtn = el(`<button class="btn btn-primary">Join Queue</button>`);
    joinBtn.onclick = openQueuePicker;
    actions.appendChild(joinBtn);
  }
  row.appendChild(actions);
  bar.appendChild(row);

  if (state.showQueuePicker) {
    if (!state.availableQueues.length) {
      bar.appendChild(el(`<div class="hint">No queues configured for your warehouse.</div>`));
    }
    state.availableQueues.forEach((q) => {
      const b = el(`<button class="btn btn-secondary">${escapeHtml(q.queue_name)} (${escapeHtml(q.activity)})</button>`);
      b.onclick = () => pickQueue(q.name);
      bar.appendChild(b);
    });
    const cancel = el(`<button class="btn btn-secondary">Cancel</button>`);
    cancel.onclick = () => setState({ showQueuePicker: false });
    bar.appendChild(cancel);
  }
  return bar;
}

function renderTasks() {
  const wrap = el(`<div></div>`);
  if (state.resource) wrap.appendChild(renderQueueBar());
  if (!state.tasks.length && !state.loading) {
    wrap.appendChild(el(`<div class="empty">No open tasks right now.</div>`));
    return wrap;
  }
  const groups = [];
  const groupByWO = {};
  state.tasks.forEach((task) => {
    if (!task.warehouse_order) { groups.push({ wo: null, tasks: [task] }); return; }
    if (!groupByWO[task.warehouse_order]) {
      const group = { wo: task.warehouse_order, tasks: [] };
      groupByWO[task.warehouse_order] = group;
      groups.push(group);
    }
    groupByWO[task.warehouse_order].tasks.push(task);
  });
  groups.forEach((group) => {
    if (!group.wo) { wrap.appendChild(taskCard(group.tasks[0])); return; }
    const confirmed = group.tasks.filter((t) => t.status === "Confirmed").length;
    const section = el(`<div class="detail-section"><h3>${escapeHtml(group.wo)} &middot; ${confirmed}/${group.tasks.length} confirmed</h3></div>`);
    group.tasks.forEach((task) => section.appendChild(taskCard(task)));
    wrap.appendChild(section);
  });
  return wrap;
}

function renderTaskDetail() {
  const task = state.currentTask;
  const wrap = el(`<div></div>`);

  wrap.appendChild(el(`
    <div class="detail-section">
      <h3>${escapeHtml(task.task_type)} &middot; ${escapeHtml(task.priority)}</h3>
      <div class="detail-grid">
        <div><div class="label">Product</div><div>${escapeHtml(task.product || "-")}</div></div>
        <div><div class="label">Planned</div><div>${task.planned_quantity} ${escapeHtml(task.stock_uom || "")}</div></div>
        <div><div class="label">Source</div><div>${escapeHtml(task.source_bin || "-")}${task.source_hu ? " / " + escapeHtml(task.source_hu) : ""}</div></div>
        <div><div class="label">Destination</div><div>${escapeHtml(task.destination_bin || "-")}${task.destination_hu ? " / " + escapeHtml(task.destination_hu) : ""}</div></div>
      </div>
    </div>
  `));

  if (state.exceptionCodesLoaded) {
    const excSection = el(`<div class="detail-section"><h3>Select exception</h3></div>`);
    if (!state.exceptionCodes.length) {
      excSection.appendChild(el(`<div class="hint">No exception codes are configured for this task type. Ask a supervisor to set one up under WMS Exception Code.</div>`));
    }
    state.exceptionCodes.forEach((code) => {
      const b = el(`<button class="btn btn-danger">${escapeHtml(code.exception_name)}${code.requires_supervisor ? " \u{1F512}" : ""}</button>`);
      b.onclick = () => submitException(code.name);
      excSection.appendChild(b);
    });
    if (state.exceptionCodes.some((c) => c.requires_comment)) {
      const field = el(`
        <div class="field">
          <label>Comment (required for some exceptions)</label>
          <input type="text" placeholder="What happened?" value="${escapeHtml(state.exceptionRemarks)}">
        </div>
      `);
      field.querySelector("input").oninput = (e) => { state.exceptionRemarks = e.target.value; };
      excSection.appendChild(field);
    }
    const cancel = el(`<button class="btn btn-secondary">Back</button>`);
    cancel.onclick = () => setState({ exceptionCodes: [], exceptionCodesLoaded: false, exceptionRemarks: "" });
    excSection.appendChild(cancel);
    wrap.appendChild(excSection);
    return wrap;
  }

  const form = el(`<div class="detail-section"></div>`);
  form.appendChild(el(`
    <div class="field">
      <label>Scan source</label>
      <input type="text" id="scan-source" placeholder="Bin or HU barcode" value="${escapeHtml(state.scanSource)}">
    </div>
  `));
  form.appendChild(el(`
    <div class="field">
      <label>Scan destination</label>
      <input type="text" id="scan-destination" placeholder="Bin or HU barcode" value="${escapeHtml(state.scanDestination)}">
    </div>
  `));
  form.appendChild(el(`
    <div class="field">
      <label>Confirmed quantity</label>
      <input type="number" inputmode="decimal" id="confirm-qty" value="${escapeHtml(state.confirmQty)}">
      <div class="hint">Remaining: ${flt(task.planned_quantity) - flt(task.confirmed_quantity)} ${escapeHtml(task.stock_uom || "")}</div>
    </div>
  `));
  wrap.appendChild(form);

  const confirmBtn = el(`<button class="btn btn-primary">Confirm</button>`);
  confirmBtn.onclick = () => {
    state.scanSource = document.getElementById("scan-source").value;
    state.scanDestination = document.getElementById("scan-destination").value;
    state.confirmQty = document.getElementById("confirm-qty").value;
    confirmCurrentTask();
  };
  wrap.appendChild(confirmBtn);

  const excBtn = el(`<button class="btn btn-danger">Report exception</button>`);
  excBtn.onclick = openExceptionPicker;
  wrap.appendChild(excBtn);

  return wrap;
}

    wrap.appendChild(row);
  });
  if (!state.receiveLines.length) wrap.appendChild(el(`<div class="empty">Nothing left to receive on this delivery.</div>`));
  const btn = el(`<button class="btn btn-primary">Submit Goods Receipt</button>`);
  btn.onclick = submitReceipt;
  wrap.appendChild(btn);
  return wrap;
}

// ----- Ship -----
function renderShipList() {
  const wrap = el(`<div></div>`);
  if (!state.shipDeliveries.length && !state.loading) {
    wrap.appendChild(el(`<div class="empty">Nothing ready to ship.</div>`));
    return wrap;
  }
  state.shipDeliveries.forEach((d) => {
    const card = el(`
      <div class="card">
        <div class="row1"><div class="task-type">${escapeHtml(d.outbound_delivery_number)}</div><span class="badge Normal">${escapeHtml(d.status)}</span></div>
        <div class="meta">${escapeHtml(d.customer || "")}<br>${escapeHtml(d.staging_bin || "")}${d.door ? " &middot; Door " + escapeHtml(d.door) : ""}${d.route ? " &middot; " + escapeHtml(d.route) : ""}</div>
      </div>
    `);
    card.onclick = () => openShipDelivery(d);
    wrap.appendChild(card);
  });
  return wrap;
}

function renderShipDetail() {
  const wrap = el(`<div></div>`);
  const delivery = state.currentShipDelivery;
  if (delivery.route || delivery.door) {
    wrap.appendChild(el(`
      <div class="detail-section">
        <div class="detail-grid">
          <div><div class="label">Route</div><div>${escapeHtml(delivery.route || "-")}</div></div>
          <div><div class="label">Door</div><div>${escapeHtml(delivery.door || "-")}</div></div>
        </div>
      </div>
    `));
  }
  state.shipLines.forEach((line, i) => {
    const row = el(`
      <div class="detail-section line-row">
        <div class="line-head">${escapeHtml(line.item)}</div>
        <div class="line-sub">Remaining: ${line.remaining} ${escapeHtml(line.stock_uom)} &middot; ${escapeHtml(line.stock_type)}</div>
        <div class="field"><label>Handling Unit</label><input type="text" data-i="${i}" data-f="handling_unit" value="${escapeHtml(line.handling_unit)}" placeholder="Scan staged HU"></div>
        <div class="field"><label>Quantity</label><input type="number" inputmode="decimal" data-i="${i}" data-f="quantity" value="${escapeHtml(line.quantity)}"></div>
      </div>
    `);
    row.querySelectorAll("input").forEach((input) => {
      input.oninput = (e) => updateShipLine(parseInt(e.target.dataset.i, 10), e.target.dataset.f, e.target.value);
    });
    wrap.appendChild(row);
  });
  const btn = el(`<button class="btn btn-primary">Submit Goods Issue</button>`);
  btn.onclick = submitGoodsIssue;
  wrap.appendChild(btn);
  return wrap;
}

// ----- Pack -----
function renderPackList() {
  const wrap = el(`<div></div>`);
  if (!state.packingOrders.length && !state.loading) {
    wrap.appendChild(el(`<div class="empty">No open packing orders.</div>`));
    return wrap;
  }
  state.packingOrders.forEach((order) => {
    const card = el(`
      <div class="card">
        <div class="row1"><div class="task-type">${escapeHtml(order.name)}</div><span class="badge Normal">${escapeHtml(order.status)}</span></div>
        <div class="meta">${escapeHtml((order.source_hus || []).join(", "))} &rarr; ${escapeHtml((order.destination_hus || []).join(", "))}</div>
      </div>
    `);
    const btn = el(`<button class="btn btn-primary" style="margin-top:8px;">Complete Packing</button>`);
    btn.onclick = (e) => { e.stopPropagation(); completePacking(order); };
    const box = el(`<div></div>`);
    box.appendChild(card);
    box.appendChild(btn);
    wrap.appendChild(box);
  });
  return wrap;
}

// ----- Move -----
function renderMove() {
  const wrap = el(`<div></div>`);
  const f = state.moveForm;
  const section = el(`<div class="detail-section"><h3>Move stock between bins</h3></div>`);
  const fields = [
    ["product", "Product"], ["quantity", "Quantity"], ["stock_uom", "UOM"], ["stock_type", "Stock Type"],
    ["source_bin", "Source Bin"], ["source_hu", "Source HU (optional)"],
    ["destination_bin", "Destination Bin"], ["destination_hu", "Destination HU (optional)"],
  ];
  fields.forEach(([key, label]) => {
    const type = key === "quantity" ? "number" : "text";
    section.appendChild(el(`
      <div class="field"><label>${escapeHtml(label)}</label>
        <input type="${type}" inputmode="${type === "number" ? "decimal" : "text"}" data-f="${key}" value="${escapeHtml(f[key])}">
      </div>
    `));
  });
  section.querySelectorAll("input").forEach((input) => {
    input.oninput = (e) => { state.moveForm[e.target.dataset.f] = e.target.value; };
  });
  wrap.appendChild(section);
  const btn = el(`<button class="btn btn-primary">Move</button>`);
  btn.onclick = submitMove;
  wrap.appendChild(btn);
  return wrap;
}

// ----- Count -----
function renderCountList() {
  const wrap = el(`<div></div>`);
  if (!state.counts.length && !state.loading) {
    wrap.appendChild(el(`<div class="empty">No open counts.</div>`));
    return wrap;
  }
  state.counts.forEach((count) => {
    const card = el(`
      <div class="card">
        <div class="row1"><div class="task-type">${escapeHtml(count.name)}</div><span class="badge Normal">${escapeHtml(count.status)}</span></div>
        <div class="meta">${escapeHtml(count.warehouse)}${count.storage_bin ? " / " + escapeHtml(count.storage_bin) : ""}<br>${(count.items || []).length} line(s) left to count</div>
      </div>
    `);
    card.onclick = () => openCount(count);
    wrap.appendChild(card);
  });
  return wrap;
}

function renderCountDetail() {
  const wrap = el(`<div></div>`);
  state.currentCountItems.forEach((row, i) => {
    const line = el(`
      <div class="detail-section line-row">
        <div class="line-head">${escapeHtml(row.product)}</div>
        <div class="line-sub">${escapeHtml(row.storage_bin)}${row.handling_unit ? " / " + escapeHtml(row.handling_unit) : ""} &middot; book ${row.book_quantity} ${escapeHtml(row.stock_uom)}</div>
        <div class="field"><label>Counted quantity</label><input type="number" inputmode="decimal" data-i="${i}" value="${escapeHtml(row.counted_quantity)}"></div>
      </div>
    `);
    line.querySelector("input").oninput = (e) => updateCountLine(i, e.target.value);
    wrap.appendChild(line);
  });
  const btn = el(`<button class="btn btn-primary">Save Counts</button>`);
  btn.onclick = submitCounts;
  wrap.appendChild(btn);
  return wrap;
}

// ----- Quality -----
function renderQualityList() {
  const wrap = el(`<div></div>`);
  if (!state.inspections.length && !state.loading) {
    wrap.appendChild(el(`<div class="empty">No open inspections.</div>`));
    return wrap;
  }
  state.inspections.forEach((insp) => {
    const card = el(`
      <div class="card">
        <div class="row1"><div class="task-type">${escapeHtml(insp.product)}</div><span class="badge Normal">${escapeHtml(insp.from_stock_type)}</span></div>
        <div class="meta">${escapeHtml(insp.storage_bin)}${insp.handling_unit ? " / " + escapeHtml(insp.handling_unit) : ""}</div>
        <div class="qty">${insp.quantity} ${escapeHtml(insp.stock_uom)}</div>
      </div>
    `);
    card.onclick = () => openInspection(insp);
    wrap.appendChild(card);
  });
  return wrap;
}

function renderQualityDetail() {
  const insp = state.currentInspection;
  const wrap = el(`<div></div>`);
  wrap.appendChild(el(`
    <div class="detail-section">
      <h3>${escapeHtml(insp.product)}</h3>
      <div class="detail-grid">
        <div><div class="label">Quantity</div><div>${insp.quantity} ${escapeHtml(insp.stock_uom)}</div></div>
        <div><div class="label">From</div><div>${escapeHtml(insp.from_stock_type)}</div></div>
        <div><div class="label">Pass &rarr;</div><div>${escapeHtml(insp.passed_to_stock_type)}</div></div>
        <div><div class="label">Fail &rarr;</div><div>${escapeHtml(insp.failed_to_stock_type)}</div></div>
      </div>
    </div>
  `));
  const form = el(`<div class="detail-section"></div>`);
  form.appendChild(el(`<div class="field"><label>Passed quantity</label><input type="number" inputmode="decimal" id="qty-pass" value="${escapeHtml(state.qualityPassed)}"></div>`));
  form.appendChild(el(`<div class="field"><label>Failed quantity</label><input type="number" inputmode="decimal" id="qty-fail" value="${escapeHtml(state.qualityFailed)}"></div>`));
  wrap.appendChild(form);
  const btn = el(`<button class="btn btn-primary">Complete Inspection</button>`);
  btn.onclick = () => {
    state.qualityPassed = document.getElementById("qty-pass").value;
    state.qualityFailed = document.getElementById("qty-fail").value;
    submitInspection();
  };
  wrap.appendChild(btn);
  return wrap;
}

// ----- Handling Units -----
function renderHUList() {
  const wrap = el(`<div></div>`);
  const searchField = el(`
    <div class="field">
      <label>Search by barcode</label>
      <input type="text" placeholder="Scan or type an HU barcode" value="${escapeHtml(state.huSearch)}">
    </div>
  `);
  const input = searchField.querySelector("input");
  input.oninput = (e) => { state.huSearch = e.target.value; };
  input.onkeydown = (e) => { if (e.key === "Enter") searchHU(input.value); };
  wrap.appendChild(searchField);

  const newBtn = el(`<button class="btn btn-primary">+ Create Handling Unit</button>`);
  newBtn.onclick = openHUCreate;
  wrap.appendChild(newBtn);

  if (!state.huList.length && !state.loading) {
    wrap.appendChild(el(`<div class="empty">No handling units found.</div>`));
    return wrap;
  }
  state.huList.forEach((hu) => {
    const card = el(`
      <div class="card">
        <div class="row1">
          <div class="task-type">${escapeHtml(hu.hu_number)}</div>
          <span class="badge ${hu.status === "Blocked" ? "High" : "Normal"}">${escapeHtml(hu.status)}</span>
        </div>
        <div class="meta">${escapeHtml(hu.hu_type)} &middot; ${escapeHtml(hu.current_bin || "-")}${hu.parent_hu ? " &middot; in " + escapeHtml(hu.parent_hu) : ""}</div>
        <div class="qty">${escapeHtml(hu.stock_status)}</div>
      </div>
    `);
    card.onclick = () => openHU(hu);
    wrap.appendChild(card);
  });
  return wrap;
}

function renderHUCreate() {
  const wrap = el(`<div></div>`);
  const form = el(`<div class="detail-section"></div>`);
  const selectedType = state.hu_types.find((t) => t.name === state.newHU.hu_type);
  const isInternal = selectedType && selectedType.numbering_mode === "Internal";
  const barcodeField = el(`<div class="field"><label>Barcode</label><input type="text" id="hu-number" placeholder="${isInternal ? "Leave blank - number is auto-assigned" : "Scan the blank HU barcode"}" value="${escapeHtml(state.newHU.hu_number)}" ${isInternal ? "disabled" : ""}></div>`);
  form.appendChild(barcodeField);
  const typeField = el(`<div class="field"><label>Handling Unit Type</label><select id="hu-type"><option value="">Select type</option></select></div>`);
  const select = typeField.querySelector("select");
  state.hu_types.forEach((t) => select.appendChild(el(`<option value="${escapeHtml(t.name)}" ${t.name === state.newHU.hu_type ? "selected" : ""}>${escapeHtml(t.name)}</option>`)));
  select.onchange = () => {
    setState({ newHU: { ...state.newHU, hu_type: select.value, hu_number: document.getElementById("hu-number").value } });
  };
  form.appendChild(typeField);
  form.appendChild(el(`<div class="field"><label>Storage bin</label><input type="text" id="hu-bin" placeholder="Scan a bin (or leave blank if nesting)" value="${escapeHtml(state.newHU.storage_bin)}"></div>`));
  form.appendChild(el(`<div class="field"><label>Parent Handling Unit</label><input type="text" id="hu-parent" placeholder="Scan a parent HU to nest into (optional)" value="${escapeHtml(state.newHU.parent_hu)}"></div>`));
  wrap.appendChild(form);
  const btn = el(`<button class="btn btn-primary">Create</button>`);
  btn.onclick = () => {
    state.newHU = {
      hu_number: document.getElementById("hu-number").value,
      hu_type: document.getElementById("hu-type").value,
      storage_bin: document.getElementById("hu-bin").value,
      parent_hu: document.getElementById("hu-parent").value,
    };
    submitCreateHU();
  };
  wrap.appendChild(btn);
  return wrap;
}

function renderHUDetail() {
  const hu = state.currentHU;
  const wrap = el(`<div></div>`);
  wrap.appendChild(el(`
    <div class="detail-section">
      <h3>${escapeHtml(hu.hu_number)} &middot; ${escapeHtml(hu.status)}</h3>
      <div class="detail-grid">
        <div><div class="label">Type</div><div>${escapeHtml(hu.hu_type)}</div></div>
        <div><div class="label">Bin</div><div>${escapeHtml(hu.current_bin || "-")}</div></div>
        <div><div class="label">Parent HU</div><div>${escapeHtml(hu.parent_hu || "-")}</div></div>
        <div><div class="label">Stock</div><div>${escapeHtml(hu.stock_status)}</div></div>
      </div>
    </div>
  `));

  if (hu.stock && hu.stock.length) {
    const stockSection = el(`<div class="detail-section"><h3>Contents</h3></div>`);
    hu.stock.forEach((row) => {
      stockSection.appendChild(el(`<div class="meta">${escapeHtml(row.product)} &middot; ${row.quantity} ${escapeHtml(row.stock_uom)} &middot; ${escapeHtml(row.stock_type)}</div>`));
    });
    wrap.appendChild(stockSection);
  }

  if (hu.children && hu.children.length) {
    const childSection = el(`<div class="detail-section"><h3>Nested Handling Units</h3></div>`);
    hu.children.forEach((child) => {
      const row = el(`<div class="meta">${escapeHtml(child.hu_number)} &middot; ${escapeHtml(child.status)}</div>`);
      row.onclick = () => openHU(child);
      childSection.appendChild(row);
    });
    wrap.appendChild(childSection);
  }

  const actions = el(`<div class="detail-section"><h3>Actions</h3></div>`);
  if (hu.parent_hu) {
    const unnestBtn = el(`<button class="btn btn-secondary">Unnest from ${escapeHtml(hu.parent_hu)}</button>`);
    unnestBtn.onclick = submitUnnestHU;
    actions.appendChild(unnestBtn);
  } else {
    const nestField = el(`<div class="field"><label>Nest into parent HU</label><input type="text" placeholder="Scan parent HU barcode" value="${escapeHtml(state.huNestTarget)}"></div>`);
    nestField.querySelector("input").oninput = (e) => { state.huNestTarget = e.target.value; };
    actions.appendChild(nestField);
    const nestBtn = el(`<button class="btn btn-secondary">Nest</button>`);
    nestBtn.onclick = submitNestHU;
    actions.appendChild(nestBtn);
  }
  const blockBtn = el(`<button class="btn ${hu.status === "Blocked" ? "btn-primary" : "btn-danger"}">${hu.status === "Blocked" ? "Unblock" : "Block"}</button>`);
  blockBtn.onclick = toggleBlockHU;
  actions.appendChild(blockBtn);
  wrap.appendChild(actions);

  const backBtn = el(`<button class="btn btn-secondary">Back to Handling Units</button>`);
  backBtn.onclick = loadHUHome;
  wrap.appendChild(backBtn);
  return wrap;
}

// ----- Load / Shipments -----
function renderLoadList() {
  const wrap = el(`<div></div>`);
  if (!state.shipments.length && !state.loading) {
    wrap.appendChild(el(`<div class="empty">Nothing ready to load.</div>`));
    return wrap;
  }
  state.shipments.forEach((s) => {
    const card = el(`
      <div class="card">
        <div class="row1"><div class="task-type">${escapeHtml(s.shipment_number)}</div><span class="badge Normal">${escapeHtml(s.status)}</span></div>
        <div class="meta">${escapeHtml(s.route || "-")}${s.door ? " &middot; Door " + escapeHtml(s.door) : ""}</div>
        <div class="qty">${s.loaded_count} / ${s.total_count} loaded</div>
      </div>
    `);
    card.onclick = () => openShipment(s);
    wrap.appendChild(card);
  });
  return wrap;
}

function renderLoadDetail() {
  const shipment = state.currentShipment;
  const wrap = el(`<div></div>`);
  wrap.appendChild(el(`
    <div class="detail-section">
      <h3>${escapeHtml(shipment.shipment_number)} &middot; ${escapeHtml(shipment.status)}</h3>
      <div class="detail-grid">
        <div><div class="label">Route</div><div>${escapeHtml(shipment.route || "-")}</div></div>
        <div><div class="label">Door</div><div>${escapeHtml(shipment.door || shipment.staging_bin || "-")}</div></div>
      </div>
    </div>
  `));
  const list = el(`<div class="detail-section"><h3>Handling Units</h3></div>`);
  shipment.handling_units.forEach((h) => {
    const row = el(`
      <div class="card">
        <div class="row1"><div class="task-type">${escapeHtml(h.handling_unit)}</div><span class="badge ${h.loaded ? "Normal" : "High"}">${h.loaded ? "Loaded" : "Pending"}</span></div>
      </div>
    `);
    if (!h.loaded) row.onclick = () => confirmHULoaded(h.handling_unit);
    list.appendChild(row);
  });
  wrap.appendChild(list);
  if (shipment.status === "Loaded") {
    const departBtn = el(`<button class="btn btn-primary">Depart</button>`);
    departBtn.onclick = departCurrentShipment;
    wrap.appendChild(departBtn);
  }
  const backBtn = el(`<button class="btn btn-secondary">Back to Shipments</button>`);
  backBtn.onclick = loadShipments;
  wrap.appendChild(backBtn);
  return wrap;
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}
function frappeEscapeAttr(s) { return escapeHtml(s); }

render();
loadResource();
</script>
</body>
