<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>{{ _("WMS Scanner") }}</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #171a21;
    --panel-2: #1f232c;
    --panel-3: #262b36;
    --border: #2a2f3a;
    --text: #f1f3f6;
    --muted: #8b93a3;
    --accent: #3d7dfa;
    --accent-2: #6f5bff;
    --accent-grad: linear-gradient(135deg, var(--accent), var(--accent-2));
    --accent-text: #ffffff;
    --danger: #e5484d;
    --warn: #d9a441;
    --ok: #2fb35c;
    --radius: 10px;
    --radius-lg: 14px;
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;
    --shadow-1: 0 1px 2px rgba(0,0,0,.3), 0 1px 1px rgba(0,0,0,.2);
    --shadow-2: 0 8px 24px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.25);
    --ease: 140ms cubic-bezier(.2,.8,.2,1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100%; overscroll-behavior-y: contain; }
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh;
    background: radial-gradient(1200px 600px at 50% -10%, rgba(61,125,250,.08), transparent), var(--bg); }

  header { position: relative; display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
    flex: 0 0 auto; gap: 10px; box-shadow: var(--shadow-1); }
  header::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--accent-grad); }
  header .title-wrap { min-width: 0; }
  header .title { font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    letter-spacing: -.01em; }
  header .user { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .resource-chip { display: inline-flex; align-items: center; gap: 4px; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 600; color: var(--text); }
  header .home-btn { background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 8px 12px; font-size: 14px; font-weight: 600; flex: 0 0 auto;
    transition: transform var(--ease), background var(--ease); }
  header .home-btn:active { transform: scale(.96); background: var(--panel-3); }
  header .home-btn-secondary { background: transparent; color: var(--muted); font-weight: 500; }

  main { flex: 1 1 auto; overflow-y: auto; padding: 12px; padding-bottom: 84px; }

  .fnkey-bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 1px;
    background: var(--border); border-top: 1px solid var(--border); box-shadow: 0 -6px 16px rgba(0,0,0,.3); z-index: 40; }
  .fnkey { flex: 1 1 0; background: var(--panel); color: var(--text); border: none; padding: 10px 4px 12px;
    display: flex; flex-direction: column; align-items: center; gap: 2px; font-family: inherit;
    transition: background var(--ease); }
  .fnkey:active { background: var(--panel-3); }
  .fnkey-num { font-size: 10px; font-weight: 800; color: var(--accent); letter-spacing: .04em; }
  .fnkey-label { font-size: 11px; font-weight: 600; color: var(--muted); }

  .banner { padding: 12px 14px; border-radius: var(--radius); margin-bottom: 12px; font-size: 14px; }
  .banner.error { background: rgba(229,72,77,0.15); border: 1px solid var(--danger); color: #ffb3b5; }
  .banner.ok { background: rgba(47,179,92,0.15); border: 1px solid var(--ok); color: #a9e8bb; }

  .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .menu-btn { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 20px 10px; text-align: center; font-size: 15px; font-weight: 700; box-shadow: var(--shadow-1);
    transition: transform var(--ease), box-shadow var(--ease), border-color var(--ease); }
  .menu-btn:active { transform: scale(.97); background: var(--panel-2); box-shadow: none; }
  .menu-btn .icon { font-size: 26px; display: block; margin-bottom: 8px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.3)); }
  .menu-btn .count { display: inline-block; margin-top: 6px; font-size: 12px; font-weight: 700;
    color: var(--accent-text); background: var(--accent-grad); border-radius: 999px; padding: 2px 8px; }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow-1);
    transition: transform var(--ease), box-shadow var(--ease), background var(--ease); }
  .card:active { transform: scale(.985); background: var(--panel-2); }
  .card .row1 { display: flex; justify-content: space-between; align-items: center; }
  .card .task-type { font-weight: 700; font-size: 16px; }
  .badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; text-transform: uppercase; display: inline-block; }
  .badge.Low { background: #2a2f3a; color: var(--muted); }
  .badge.Normal { background: #23324d; color: #9cc2ff; }
  .badge.High { background: #4d3a1f; color: var(--warn); }
  .badge.Urgent { background: #4d1f24; color: var(--danger); }
  .badge.Open, .badge.Available { background: #23324d; color: #9cc2ff; }
  .badge.Assigned { background: #33264d; color: #c8a4ff; }
  .badge.InProcess { color: var(--accent-text); background: var(--accent); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .6; } }
  .badge.PartiallyConfirmed { background: #4d3a1f; color: var(--warn); }
  .badge.Confirmed { background: rgba(47,179,92,0.18); color: var(--ok); }
  .badge.OnHold { background: #2a2f3a; color: var(--muted); }
  .badge.Cancelled { background: #2a2f3a; color: var(--muted); text-decoration: line-through; }
  .badge.Exception { background: rgba(229,72,77,0.18); color: #ffb3b5; }
  .row1 > div:last-child { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .card .meta { color: var(--muted); font-size: 13px; margin-top: 6px; line-height: 1.5; }
  .card .qty { font-size: 13px; margin-top: 4px; }
  .card.card-blocked { opacity: .6; }
  .blocked-reason { color: var(--warn); }
  .empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 14px; }

  .timeline-row { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; }
  .timeline-dot { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-size: 12px; font-weight: 700; margin-top: 4px; }
  .timeline-dot.done { background: var(--ok); color: #08210f; }
  .timeline-dot.active { background: var(--accent); color: var(--accent-text); }
  .timeline-dot.pending { background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); }
  .timeline-card { flex: 1 1 auto; min-width: 0; }
  .timeline-card .card { margin-bottom: 0; }

  .step-dots { display: flex; gap: 6px; margin-bottom: 14px; }
  .step-dots .dot { flex: 1 1 auto; height: 4px; border-radius: 2px; background: var(--border); }
  .step-dots .dot.done { background: var(--ok); }
  .step-dots .dot.active { background: var(--accent); }
  .step-label { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; }
  .field .field-error { font-size: 12px; color: var(--danger); margin-top: 4px; }
  .field input.invalid { border-color: var(--danger); }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; }
  .field input, .field select { width: 100%; font-size: 18px; padding: 12px 14px; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text); }
  .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
  .field .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .btn { display: block; width: 100%; padding: 16px; font-size: 16px; font-weight: 700; border-radius: var(--radius);
    border: none; margin-bottom: 10px; font-family: inherit; cursor: pointer;
    transition: transform var(--ease), box-shadow var(--ease), opacity var(--ease); }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn-primary { background: var(--accent-grad); color: var(--accent-text); box-shadow: var(--shadow-1); }
  .btn-secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: rgba(229,72,77,0.15); color: #ffb3b5; border: 1px solid var(--danger); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .detail-section { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px; margin-bottom: 14px; box-shadow: var(--shadow-1); }
  .detail-section h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .detail-section + .detail-section { margin-top: -4px; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 14px; }
  .detail-grid .label { color: var(--muted); }

  .line-row { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 10px; }
  .line-row:first-child { border-top: none; padding-top: 0; margin-top: 0; }
  .line-row .line-head { font-weight: 700; margin-bottom: 8px; }
  .line-row .line-sub { color: var(--muted); font-size: 12px; margin-bottom: 8px; }

  table.result { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.result th, table.result td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--border); }
  table.result th { color: var(--muted); font-weight: 600; }

  .spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid rgba(255,255,255,.2);
    border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .overlay { position: fixed; inset: 0; background: rgba(6,8,12,.55); backdrop-filter: blur(2px); display: flex;
    align-items: center; justify-content: center; z-index: 60; }

  .logon-header { justify-content: center; text-align: center; }
  .logon-header::after { background: var(--accent-grad); }
  .logon-header .title-wrap { width: 100%; }
  .logon-header .title { font-size: 20px; }
  .logon-wrap { display: flex; flex-direction: column; justify-content: center; min-height: calc(100dvh - 200px); gap: var(--sp-3); }
  .logon-card { text-align: left; }
</style>
</head>
<body>
<div id="app"></div>

<script>
const CSRF_TOKEN = "{{ csrf_token }}";
const USER_FULLNAME = {{ (user_fullname or "") | tojson }};
const MESSAGES = {{ messages }};

// Translation lookup for this page (a custom www page has none of the desk's __()/frappe.boot
// plumbing) - MESSAGES is {English: translated} for the current session's language, injected
// server-side by index.py via frappe._() so it stays in sync with whatever locale/es.po ships.
// args mirrors Frappe's own __()/_() convention: "{0}"/"{1}" placeholders filled positionally.
function _(text, args) {
  let out = (MESSAGES && MESSAGES[text]) || text;
  if (args) args.forEach((a, i) => { out = out.replace(`{${i}}`, a); });
  return out;
}

async function api(method, args) {
  let res;
  try {
    res = await fetch(`/api/method/${method}`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Frappe-CSRF-Token": CSRF_TOKEN },
      body: JSON.stringify(args || {}),
    });
  } catch (e) {
    // A dead WiFi zone on the floor is common and looks nothing like a server error - a raw
    // fetch() failure never reaches res.ok below, so it needs its own clear message. Every
    // caller already leaves its form state intact on a thrown error (never resets on catch),
    // so re-tapping the same submit button is already a full retry - no separate UI needed.
    throw new Error(_("Network error - check your connection and try again."));
  }
  if (res.status === 401) {
    // The underlying Frappe session (not the WMS Resource logon above it) expired mid-shift -
    // same redirect index.py's own get_context already sends a Guest through, so the operator
    // re-authenticates through the normal login page instead of seeing a bare error banner.
    window.location.href = "/login?redirect-to=/wms";
    throw new Error(_("Your session expired - redirecting to log in."));
  }
  let data = {};
  try { data = await res.json(); } catch (e) { /* no body */ }
  if (!res.ok) {
    const msg = (data && data._server_messages) ? extractServerMessage(data._server_messages)
      : (data && data.exception) || `Request failed (${res.status})`;
    throw new Error(msg);
  }
  return data.message;
}

function extractServerMessage(raw) {
  try {
    const list = JSON.parse(raw);
    const first = JSON.parse(list[0]);
    return first.message || raw;
  } catch (e) { return raw; }
}

function uid() { return Math.random().toString(36).slice(2, 10); }
function flt(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function statusClass(status) { return String(status || "").replace(/[^A-Za-z0-9]+/g, ""); }
function statusBadgeHtml(status) {
  const lock = status === "On Hold" ? "\u{1F512} " : "";
  return `<span class="badge ${statusClass(status)}">${lock}${escapeHtml(_(status))}</span>`;
}

const TASK_TYPE_GROUPS = {
  // Cross Dock tasks are created at the same point as Putaway (create_putaway_requests
  // splits a receipt row between the two) and are worked by the same receiving operator
  // immediately after - grouped with inbound rather than internal for that reason, even
  // though "Putaway Tasks" is a slight misnomer for it (Unload/Deconsolidation share that
  // same looseness already).
  inbound: ["Unload", "Putaway", "Deconsolidation", "Cross Dock"],
  internal: ["Internal Move", "Posting Change", "Inventory Count", "Consolidation"],
  outbound: ["Pick", "Stage", "Load"],
};

const SECTIONS = {
  inbound: {
    label: "Inbound", icon: "\u{1F4E5}",
    items: [
      { icon: "\u{1F4E5}", label: "Receive", action: loadInboundDeliveries },
      { icon: "\u{1F4CB}", label: "Putaway Tasks", taskGroup: "inbound", action: () => openTasksFiltered("inbound") },
      { icon: "\u{1F4E6}", label: "Deconsolidate", action: openDeconsolidation },
      { icon: "\u{2705}", label: "Quality", action: loadInspections },
    ],
  },
  internal: {
    label: "Internal", icon: "\u{2194}\u{FE0F}",
    items: [
      { icon: "\u{2194}\u{FE0F}", label: "Move", action: openMove },
      { icon: "\u{1F4CB}", label: "Internal Tasks", taskGroup: "internal", action: () => openTasksFiltered("internal") },
      { icon: "\u{27A1}\u{FE0F}", label: "Close Movement", action: openCloseMovement },
      { icon: "\u{1F501}", label: "Repack", action: openRepack },
      { icon: "\u{1F522}", label: "Count", action: loadCounts },
      { icon: "\u{1F3F7}\u{FE0F}", label: "Handling Units", action: loadHUHome },
      { icon: "\u{1F9E9}", label: "Kitting", action: loadKittingOrders },
      { icon: "\u{1F9FA}", label: "Consolidation", action: loadConsolidationGroups },
    ],
  },
  outbound: {
    label: "Outbound", icon: "\u{1F4E4}",
    items: [
      { icon: "\u{1F3AF}", label: "Picking", action: openPickingMenu },
      { icon: "\u{1F4CB}", label: "Pick Tasks", taskGroup: "outbound", action: () => openTasksFiltered("outbound") },
      { icon: "\u{1F4E4}", label: "Ship", action: loadShipDeliveries },
      { icon: "\u{1F4E6}", label: "Pack", action: loadPackingOrders },
      { icon: "\u{1F9F0}", label: "VAS", action: loadVASOrders },
      { icon: "\u{1F69B}", label: "Load", action: loadShipments },
    ],
  },
};

// Maps a view to the view it should return to when the header Back button is pressed.
const VIEW_PARENT = {
  section: () => "menu",
  tasks: () => "section",
  "task-detail": () => "tasks",
  receive: () => "section",
  "receive-detail": () => "receive",
  ship: () => "section",
  "ship-detail": () => "ship",
  pack: () => "section",
  move: () => "section",
  count: () => "section",
  "count-detail": () => "count",
  quality: () => "section",
  "quality-detail": () => "quality",
  hu: () => "section",
  "hu-detail": () => "hu",
  load: () => "section",
  "load-detail": () => "load",
  decon: () => "section",
  "decon-detail": () => "decon",
  vas: () => "section",
  "vas-detail": () => "vas",
  "vas-new": () => "vas",
  "picking-menu": () => "section",
  "picking-manual-menu": () => "picking-menu",
  "picking-entry": () => "picking-manual-menu",
  "close-movement": () => "section",
  repack: () => "section",
  "repack-detail": () => "repack",
  kitting: () => "section",
  consolidation: () => "section",
  "consolidation-detail": () => "consolidation",
  lookup: () => "menu",
};

// Reloads the list for a view when navigating back into it, so data is never stale.
const VIEW_RELOAD = {
  tasks: loadTasks, receive: loadInboundDeliveries, ship: loadShipDeliveries,
  pack: loadPackingOrders, count: loadCounts, quality: loadInspections, hu: loadHUHome,
  load: loadShipments, vas: loadVASOrders, kitting: loadKittingOrders, consolidation: loadConsolidationGroups,
};

const state = {
  loggedOn: false,
  resourceLoaded: false,
  view: "menu",
  section: null,
  loading: false,
  error: null,
  info: null,
  resource: null,
  availableResources: [],
  showResourcePicker: false,
  hu_types: [],

  // Tasks
  tasks: [],
  taskTypeFilter: null,
  availableQueues: [],
  showQueuePicker: false,
  availableWorkCenters: [],
  showWorkCenterPicker: false,
  currentTask: null,
  taskSteps: [],
  taskStep: 0,
  stepError: null,
  scanSource: "",
  scanDestination: "",
  destinationHu: "",
  confirmQty: "",
  exceptionCodes: [],
  exceptionCodesLoaded: false,
  exceptionRemarks: "",
  exceptionSelectedCode: null,
  exceptionRevisedQty: "",

  // Handling Units
  huList: [],
  huSearch: "",
  currentHU: null,
  huNestTarget: "",
  newHU: { hu_number: "", hu_type: "", storage_bin: "", parent_hu: "" },

  // Load / Shipments
  shipments: [],
  currentShipment: null,

  // Lookup
  lookupCode: "",
  lookupType: "hu",
  lookupResult: null,

  // Receive
  inboundDeliveries: [],
  currentInbound: null,
  receiveLines: [],

  // Ship
  shipDeliveries: [],
  currentShipDelivery: null,
  shipLines: [],

  // Pack
  packingOrders: [],

  // Move
  moveForm: { product: "", quantity: "", stock_uom: "", stock_type: "AVAILABLE", source_bin: "", source_hu: "", destination_bin: "", destination_hu: "" },
  moveStep: 0,
  moveStepError: null,

  // Count
  counts: [],
  currentCount: null,

  // Quality
  inspections: [],
  currentInspection: null,

  // Deconsolidation
  deconHuSearch: "",
  deconHu: null,
  deconLines: [],

  // VAS
  vasOrders: [],
  currentVAS: null,
  vasNewHu: "",
  vasNewBin: "",

  // Kitting
  kittingOrders: [],

  // Consolidation
  consolidationGroups: [],
  currentConsolidation: null,
  consolidationNewHu: "",
  consolidationScan: "",
  consolidationCandidates: [],

  // Picking entry
  pickingReference: "",
  pickingReferenceLabel: "",
  pickingReferencePlaceholder: "",
  pickingSearchType: "document",

  // Close Movement
  closeMovementHu: "",

  // Repack
  repackHuSearch: "",
  repackHu: null,
  repackLines: [],
  repackDestination: "",
  repackDestNewType: "",
};

function setState(patch) { Object.assign(state, patch); render(); }

function goHome() {
  setState({ view: "menu", section: null, error: null, info: null, currentTask: null, currentInbound: null, currentShipDelivery: null, currentCount: null, currentInspection: null, currentHU: null, taskTypeFilter: null });
  loadResource();
}

function goSection(key) {
  setState({ view: "section", section: key, error: null, info: null });
}

function goBack() {
  const parentFn = VIEW_PARENT[state.view];
  if (!parentFn) { goHome(); return; }
  const parent = parentFn();
  setState({ view: parent, error: null, info: null });
  const reload = VIEW_RELOAD[parent];
  if (reload) reload();
}

function openTasksFiltered(group) {
  setState({ view: "tasks", section: group, taskTypeFilter: TASK_TYPE_GROUPS[group] || null, error: null, info: null });
  loadTasks();
}

async function loadResource() {
  try {
    const res = await api("frappe_wms.api.scanner.my_tasks");
    setState({ resource: res.resource || null, tasks: res.tasks || [], resourceLoaded: true });
    if (!res.resource) openResourcePicker();
  } catch (e) { setState({ resourceLoaded: true }); }
}

// ---------- Resource logon (EWM RF-style: log on to a stable, pre-configured device) ----------
async function openResourcePicker() {
  setState({ loading: true, error: null });
  try {
    const resources = await api("frappe_wms.api.resource.list_available_resources", {});
    setState({ loading: false, availableResources: resources || [], showResourcePicker: true });
  } catch (e) {
    setState({ loading: false, error: e.message });
  }
}

async function pickResource(resourceCode) {
  setState({ loading: true, error: null });
  try {
    await api("frappe_wms.api.resource.log_on", { resource_code: resourceCode });
    setState({ loading: false, showResourcePicker: false, info: _("Logged on to {0}", [resourceCode]) });
    loadResource();
  } catch (e) {
    setState({ loading: false, error: e.message });
  }
}

async function doLogOff() {
  setState({ loading: true, error: null });
  try {
    await api("frappe_wms.api.resource.log_off", {});
    setState({ loading: false, loggedOn: false, resource: null, resourceLoaded: false, view: "menu", section: null, info: _("Logged off") });
    loadResource();
  } catch (e) {
    setState({ loading: false, error: e.message });
  }
}

// ---------- Tasks ----------
async function loadTasks() {

function buildTaskSteps(task) {
  const steps = [];
  if (task.source_bin || task.source_hu) steps.push("source");
  steps.push("quantity");
  if (task.destination_bin || task.destination_hu) steps.push("destination");
  steps.push("hu");
  steps.push("review");
  return steps;
}

function openTask(task) {
  if (task.status === "On Hold") {
    setState({ view: "task-detail", currentTask: task, error: null, info: null });
    return;
  }
  setState({
    view: "task-detail", currentTask: task, taskSteps: buildTaskSteps(task), taskStep: 0, stepError: null,
    scanSource: "", scanDestination: "", destinationHu: task.destination_hu || "",
    confirmQty: String(flt(task.planned_quantity) - flt(task.confirmed_quantity)),
    error: null, info: null, exceptionCodes: [], exceptionCodesLoaded: false, exceptionRemarks: "",
    exceptionSelectedCode: null, exceptionRevisedQty: "",
  });
  loadClusterBreakdown(task.name);
}

async function loadClusterBreakdown(taskName) {
  // Best-effort, non-blocking: a cluster pick task's own list-row fields only carry the
  // aggregate planned_quantity, not the per-order split - fetch the full doc only when it
  // might matter, and never let a failure here affect the task the operator is confirming.
  try {
    const full = await api("frappe_wms.api.scanner.get_task", { task_name: taskName });
    if (state.currentTask && state.currentTask.name === taskName && (full.stock_allocations || []).length > 1) {
      setState({ currentTask: { ...state.currentTask, stock_allocations: full.stock_allocations } });
    }
  } catch (e) { /* silently skip - the task still confirms fine without the breakdown */ }
}

// Validates the current wizard step client-side, mirroring what confirm_task checks
// server-side, so a mis-scan is caught before the round trip instead of after.
function validateTaskStep(task, stepKey) {
  if (stepKey === "source") {
    const expected = [task.source_bin, task.source_hu].filter(Boolean);
    if (!state.scanSource.trim()) return "Scan the source bin or Handling Unit.";
    if (!expected.includes(state.scanSource.trim())) return `Expected ${expected.join(" or ")}.`;
  }
  if (stepKey === "quantity") {
    const remaining = flt(task.planned_quantity) - flt(task.confirmed_quantity);
    const qty = flt(state.confirmQty);
    if (qty <= 0) return "Enter a quantity greater than zero.";
    if (round2(qty) > round2(remaining)) return `Cannot exceed the remaining ${remaining} ${task.stock_uom || ""}.`;
  }
  if (stepKey === "destination") {
    const expected = [task.destination_bin, task.destination_hu].filter(Boolean);
    if (!state.scanDestination.trim()) return "Scan the destination bin or Handling Unit.";
    if (!expected.includes(state.scanDestination.trim())) return `Expected ${expected.join(" or ")}.`;
  }
  return null;
}
function round2(n) { return Math.round(flt(n) * 1e6) / 1e6; }

function goTaskStep(delta) {
  const task = state.currentTask;
  const steps = state.taskSteps;
  if (delta > 0) {
    const err = validateTaskStep(task, steps[state.taskStep]);
    if (err) { setState({ stepError: err }); return; }
  }
  const next = Math.max(0, Math.min(steps.length - 1, state.taskStep + delta));
  setState({ taskStep: next, stepError: null });
}

async function confirmCurrentTask() {
  const task = state.currentTask;
  const err = validateTaskStep(task, "quantity") || (state.taskSteps.includes("destination") ? validateTaskStep(task, "destination") : null)
    || (state.taskSteps.includes("source") ? validateTaskStep(task, "source") : null);
  if (err) { setState({ stepError: err }); return; }
  setState({ loading: true, error: null });
  try {
    const result = await api("frappe_wms.api.scanner.confirm_task", {
      task_name: task.name,
      scanned_source: state.scanSource || undefined,
      scanned_destination: state.scanDestination || undefined,
      confirmed_quantity: state.confirmQty,
      destination_hu: state.destinationHu || undefined,
      idempotency_key: `${task.name}:${task.confirmed_quantity}:${uid()}`,
    });
    const msg = _("{0} {1} ({2})", [_(task.task_type), _(result.status).toLowerCase(), result.quantity]);
    await loadTasks();
    const released = result.released_tasks || [];
    const next = released.length ? state.tasks.find((t) => released.includes(t.name)) : null;
    if (next) {
      openTask(next);
      setState({ loading: false, info: `${msg} — ${_("next: {0} · {1}", [_(next.task_type), next.source_bin || next.source_hu || ""])}` });
    } else {
      setState({ loading: false, view: "tasks", info: msg, currentTask: null });
    }
  } catch (e) {
    setState({ loading: false, error: e.message });
  }
}

function selectExceptionCode(code) {
  // Pick denial (P2): a code with allows_quantity_change (e.g. OOS) closes the task at
  // whatever quantity was actually found instead of the full planned amount - needs one more
  // tap to enter that quantity before submitting, rather than reporting immediately.
  const found = state.exceptionCodes.find((c) => c.name === code);
  if (found && found.allows_quantity_change) {
    setState({ exceptionSelectedCode: code, exceptionRevisedQty: String(flt(state.currentTask.planned_quantity) - flt(state.currentTask.confirmed_quantity)) });
    return;
  }
  submitException(code);
}

async function submitException(code, revisedQuantity) {
  const task = state.currentTask;
  const requiresComment = state.exceptionCodes.find((c) => c.name === code)?.requires_comment;
  const remarks = state.exceptionRemarks.trim();
  if (requiresComment && !remarks) {
    setState({ error: _("This exception requires a comment before it can be reported.") });
    return;
  }
  if (revisedQuantity !== undefined && flt(revisedQuantity) < 0) {
    setState({ error: _("Revised quantity cannot be negative.") });
    return;
  }
  setState({ loading: true, error: null });
  try {
    await api("frappe_wms.api.scanner.raise_exception", {
      task_name: task.name, exception_code: code, remarks: remarks || undefined,
      revised_quantity: revisedQuantity !== undefined ? revisedQuantity : undefined,
    });
    setState({
      loading: false, view: "tasks", info: _("{0} flagged as exception", [_(task.task_type)]), currentTask: null,
      exceptionCodes: [], exceptionCodesLoaded: false, exceptionRemarks: "", exceptionSelectedCode: null, exceptionRevisedQty: "",
    });
    loadTasks();
  } catch (e) {
    setState({ loading: false, error: e.message });
  }
}

  activities.forEach((row, idx) => {
    const line = el(`<div class="timeline-row"><div class="timeline-dot ${row.completed ? "done" : "active"}">${row.completed ? "✓" : idx + 1}</div></div>`);
    const cardWrap = el(`<div class="timeline-card"></div>`);
    const card = el(`
      <div class="card ${row.completed ? "card-blocked" : ""}">
        <div class="row1"><div class="task-type">${escapeHtml(row.activity_type)}</div>${row.completed ? `<span class="badge Confirmed">${_("Done")}</span>` : ""}</div>
        <div class="meta">${escapeHtml(row.instruction || "")}</div>
        ${row.quantity ? `<div class="qty">${row.quantity} ${escapeHtml(row.stock_uom || "")}</div>` : ""}
      </div>
    `);
    if (!row.completed) card.onclick = () => completeVASActivity(order.name, row.name);
    cardWrap.appendChild(card);
    line.appendChild(cardWrap);
    timeline.appendChild(line);
  });
  wrap.appendChild(timeline);
  const backBtn = el(`<button class="btn btn-secondary">${_("Back to VAS Orders")}</button>`);
  backBtn.onclick = loadVASOrders;
  wrap.appendChild(backBtn);
  return wrap;
}

async function submitPickingEntry() {

    setState({ loading: false, view: "tasks", section: "outbound", taskTypeFilter: ["Pick"], tasks, info: _("{0} pick task(s) found for {1}", [tasks.length, reference]) });
  } catch (e) {
    setState({ loading: false, error: e.message });
  }
}

async function scanRepackHU() {
  const barcode = (state.repackHuSearch || "").trim();
  if (!barcode) { setState({ error: _("Scan a Handling Unit barcode.") }); return; }
  setState({ loading: true, error: null });
  try {
    if (!state.hu_types.length) await loadHuTypes();
    const detail = await api("frappe_wms.api.scanner.hu_overview", { hu_number: barcode });
    const lines = [
      { kind: "hu", label: _("This entire Handling Unit"), handling_unit: detail.handling_unit.name, selected: false },
      ...detail.children.map((c) => ({ kind: "hu", label: _("Nested HU: {0} ({1})", [c.name, c.hu_type]), handling_unit: c.name, selected: false })),
      ...detail.stock.map((s) => ({
        kind: "item", label: s.product, product: s.product, batch_no: s.batch_no || "", serial_no: s.serial_no || "",
        stock_type: s.stock_type, stock_uom: s.stock_uom, available: s.quantity, quantity: "0",
      })),
    ];
    setState({ loading: false, view: "repack-detail", repackHu: detail.handling_unit, repackLines: lines });
  } catch (e) {
    setState({ loading: false, error: e.message });
  }
}

function toggleRepackLine(i) { state.repackLines[i].selected = !state.repackLines[i].selected; render(); }
function updateRepackLineQty(i, value) { state.repackLines[i].quantity = value; }

async function submitRepack() {
  const hu = state.repackHu;
  const destination = state.repackDestination.trim();
  const huLines = state.repackLines.filter((l) => l.kind === "hu" && l.selected);
  const itemLines = state.repackLines.filter((l) => l.kind === "item" && flt(l.quantity) > 0);
  if (!huLines.length && !itemLines.length) { setState({ error: _("Select at least one Handling Unit or enter a quantity to repack.") }); return; }
  if (!destination) { setState({ error: _("Scan the destination Handling Unit (or create a new one below).") }); return; }
  setState({ loading: true, error: null });
  try {
    for (const line of huLines) {
      const childDoc = line.handling_unit === hu.name ? hu : (await api("frappe_wms.api.handling_unit.handling_unit_detail", { hu_name: line.handling_unit }));
      if (childDoc.parent_hu) {
        await api("frappe_wms.api.handling_unit.unnest_handling_unit", { hu_name: line.handling_unit });
      }
      await api("frappe_wms.api.handling_unit.nest_handling_unit", { hu_name: line.handling_unit, parent_hu: destination });
    }
    if (itemLines.length) {
      const items = itemLines.map((l) => ({ item: l.product, batch_no: l.batch_no || undefined, serial_no: l.serial_no || undefined, stock_type: l.stock_type, stock_uom: l.stock_uom, quantity: flt(l.quantity) }));
      await api("frappe_wms.api.scanner.repack", { source_hu: hu.name, destination_hu: destination, items: JSON.stringify(items), idempotency_key: `RF-REPACK:${hu.name}:${uid()}` });
    }
    setState({ loading: false, view: "hu", info: _("Repacked into {0}", [destination]), repackHu: null, repackLines: [] });
    loadHUHome();
  } catch (e) {
    setState({ loading: false, error: e.message });
  }
}

async function createRepackDestination() {
  const huType = state.repackDestNewType;
  if (!huType) { setState({ error: _("Pick a Handling Unit Type to create a new destination.") }); return; }
  setState({ loading: true, error: null });
  try {
    const result = await api("frappe_wms.api.handling_unit.create_handling_unit", { hu_type: huType, storage_bin: state.repackHu.current_bin });
    state.repackDestination = result.name;
    setState({ loading: false, info: _("Created {0} as the destination", [result.name]) });
  } catch (e) {
    setState({ loading: false, error: e.message });
  }
}

      <div class="hint">${_("Pick whole Handling Units to move (they must land on a destination in the same bin, or be physically moved together afterward) and/or enter quantities to repack individual items. Item repack requires the destination HU to already be in this same bin.")}</div>
    </div>
  `));

  const huLines = state.repackLines.filter((l) => l.kind === "hu");
  if (huLines.length) {
    const section = el(`<div class="detail-section"><h3>${_("Handling Units")}</h3></div>`);
    state.repackLines.forEach((line, i) => {
      if (line.kind !== "hu") return;
      const row = el(`
        <div class="card ${line.selected ? "" : "card-blocked"}">
          <div class="row1"><div class="task-type">${escapeHtml(line.label)}</div>${line.selected ? `<span class="badge Confirmed">${_("Selected")}</span>` : ""}</div>
        </div>
      `);
      row.onclick = () => toggleRepackLine(i);
      section.appendChild(row);
    });
    wrap.appendChild(section);
  }

  const itemLines = state.repackLines.filter((l) => l.kind === "item");
  if (itemLines.length) {
    const section = el(`<div class="detail-section"><h3>${_("Items")}</h3></div>`);
    state.repackLines.forEach((line, i) => {
      if (line.kind !== "item") return;
      const row = el(`
        <div class="line-row">
          <div class="line-head">${escapeHtml(line.product)}</div>
          <div class="line-sub">${escapeHtml(line.batch_no || "")} ${escapeHtml(_(line.stock_type))} · ${_("available {0} {1}", [line.available, escapeHtml(line.stock_uom || "")])}</div>
          <div class="field"><label>${_("Quantity to repack")}</label><input type="number" inputmode="decimal" data-i="${i}" value="${escapeHtml(line.quantity)}"></div>
        </div>
      `);
      row.querySelector("input").oninput = (e) => updateRepackLineQty(i, e.target.value);
      section.appendChild(row);
    });
    wrap.appendChild(section);
  }

  const destSection = el(`<div class="detail-section"><h3>${_("Destination")}</h3></div>`);
  destSection.appendChild(el(`
    <div class="field">
      <label>${_("Destination Handling Unit")}</label>
      <input type="text" id="repack-destination" placeholder="${_("Scan an existing HU barcode")}" value="${escapeHtml(state.repackDestination)}">
    </div>
  `));
  destSection.querySelector("input").oninput = (e) => { state.repackDestination = e.target.value; };
  const huTypeOptions = state.hu_types.map((t) => `<option value="${frappeEscapeAttr(t.name)}" ${t.name === state.repackDestNewType ? "selected" : ""}>${escapeHtml(t.name)}</option>`).join("");
  const newHuField = el(`
    <div class="field">
      <label>${_("...or create a new one")}</label>
      <select id="repack-new-type"><option value="">${_("Select HU type")}</option>${huTypeOptions}</select>
    </div>
  `);
  newHuField.querySelector("select").onchange = (e) => { state.repackDestNewType = e.target.value; };
  destSection.appendChild(newHuField);
  const createBtn = el(`<button class="btn btn-secondary">${_("Create as destination")}</button>`);
  createBtn.onclick = createRepackDestination;
  destSection.appendChild(createBtn);
  wrap.appendChild(destSection);

  const submitBtn = el(`<button class="btn btn-primary">${_("Repack")}</button>`);
  submitBtn.onclick = submitRepack;
  wrap.appendChild(submitBtn);
  return wrap;
}

// ---------- Move ----------
const MOVE_STEPS = ["item", "quantity", "source", "destination", "review"];

function openMove() {
  setState({
    view: "move", section: "internal", error: null, info: null, moveStep: 0, moveStepError: null,
    moveForm: { product: "", quantity: "", stock_uom: "", stock_type: "AVAILABLE",
      source_bin: "", source_hu: "", destination_bin: "", destination_hu: "" },
  });
}

function validateMoveStep(stepKey) {
  const f = state.moveForm;
  if (stepKey === "item" && (!f.product || !f.stock_uom)) return "Product and UOM are required.";
  if (stepKey === "quantity" && !(flt(f.quantity) > 0)) return "Enter a quantity greater than zero.";
  if (stepKey === "source" && !f.source_bin && !f.source_hu) return "Scan a source bin or a source Handling Unit.";
  if (stepKey === "destination" && !f.destination_bin) return "Scan the destination bin.";
  return null;
}

function goMoveStep(delta) {
  if (delta > 0) {
    const err = validateMoveStep(MOVE_STEPS[state.moveStep]);
    if (err) { setState({ moveStepError: err }); return; }
  }
  const next = Math.max(0, Math.min(MOVE_STEPS.length - 1, state.moveStep + delta));
  setState({ moveStep: next, moveStepError: null });
}

async function submitMove() {
  const f = state.moveForm;
  for (const step of MOVE_STEPS) {
    if (step === "review") continue;
    const err = validateMoveStep(step);
    if (err) { setState({ moveStepError: err }); return; }
  }
  setState({ loading: true, error: null });
  try {
    const warehouse = state.resource ? state.resource.warehouse : f.warehouse;
    const result = await api("frappe_wms.api.scanner.create_and_confirm_move", {
      warehouse, product: f.product, quantity: flt(f.quantity), stock_uom: f.stock_uom, stock_type: f.stock_type,
      source_bin: f.source_bin || undefined, source_hu: f.source_hu || undefined,
      destination_bin: f.destination_bin, destination_hu: f.destination_hu || undefined,
    });
    setState({ loading: false, view: "section", section: "internal", info: _("Moved {0} {1} to {2}", [result.quantity, f.product, f.destination_bin]) });
  } catch (e) {
    setState({ loading: false, error: e.message });
  }
}

async function openCount(count) {
  if (count.status === "Draft") {
    setState({ loading: true, error: null });
    try {
      await api("frappe_wms.api.inventory.snapshot_count", { count_name: count.name });
      const rows = await api("frappe_wms.api.inventory.list_open_counts");
      const updated = (rows || []).find((c) => c.name === count.name);
      setState({ loading: false, counts: rows || [] });
      if (!updated) { setState({ error: _("Count could not be started - it may have no stock in scope.") }); return; }
      count = updated;
    } catch (e) {
      setState({ loading: false, error: e.message });
      return;
    }
  }
  const items = (count.items || []).map((row) => ({ ...row, counted_quantity: row.counted_quantity != null ? String(row.counted_quantity) : "" }));
  setState({ view: "count-detail", currentCount: count, currentCountItems: items, error: null, info: null });

async function submitCounts() {
  const count = state.currentCount;
  const counted = {};
  state.currentCountItems.forEach((row) => {
    if (row.counted_quantity !== "") counted[row.name] = flt(row.counted_quantity);
  });
  if (!Object.keys(counted).length) { setState({ error: _("Enter at least one counted quantity.") }); return; }
  setState({ loading: true, error: null });
  try {
    const result = await api("frappe_wms.api.inventory.record_counts", { count_name: count.name, counted_quantities: JSON.stringify(counted) });
    if (result.status === "Counted") {
      try {
        const posted = await api("frappe_wms.api.inventory.post_count", { count_name: count.name });
        const info = posted.status === "Posted"
          ? _("Count {0} fully counted and posted", [count.name])
          : _("Count {0} fully counted; a variance is out of tolerance and is held for recount/supervisor approval", [count.name]);
        setState({ loading: false, view: "section", section: "internal", info });
        return;
      } catch (e) {
        setState({ loading: false, view: "section", section: "internal", info: _("Count {0} fully counted; ask a supervisor to post it", [count.name]) });
        return;
      }
    }
    setState({ loading: false, view: "section", section: "internal", info: _("Saved counts for {0}", [count.name]) });
  } catch (e) {
    setState({ loading: false, error: e.message });
  }

// ---------- Function-key footer (authentic SAP RF terminal touch) ----------
// Executes the same action as the current screen's primary button - wired to F8/Enter so a
// scanner's Enter-after-scan keystroke (or a real RF handheld's F8 key) advances the screen
// exactly like tapping it would.
function primaryAction() {
  const view = state.view;
  if (view === "task-detail" && state.currentTask && state.currentTask.status !== "On Hold" && !state.exceptionCodesLoaded) {
    const stepKey = state.taskSteps[state.taskStep];
    if (stepKey === "review") confirmCurrentTask(); else goTaskStep(1);
    return;
  }
  if (view === "move") {
    const stepKey = MOVE_STEPS[state.moveStep];
    if (stepKey === "review") submitMove(); else goMoveStep(1);
    return;
  }
  const ACTIONS = {
    decon: scanDeconHU, "decon-detail": submitDeconsolidation,
    "receive-detail": submitReceipt, "ship-detail": submitGoodsIssue,
    "count-detail": submitCounts, "quality-detail": submitInspection, "hu-create": submitCreateHU, lookup: runLookup,
  };
  if (ACTIONS[view]) ACTIONS[view]();
}

function renderFnKeyBar() {
  const bar = el(`<div class="fnkey-bar"></div>`);
  const keys = [];
  if (state.view !== "menu") keys.push({ key: "F3", label: "Back", action: goBack });
  const reload = VIEW_RELOAD[state.view];
  if (reload) keys.push({ key: "F5", label: "Refresh", action: reload });
  if (state.view === "task-detail" && state.currentTask && state.currentTask.status !== "On Hold" && !state.exceptionCodesLoaded) {
    keys.push({ key: "F7", label: "Exception", action: openExceptionPicker });
  }
  keys.push({ key: "F8", label: "Enter", action: primaryAction });
  keys.forEach((k) => {
    const btn = el(`<button class="fnkey"><span class="fnkey-num">${k.key}</span><span class="fnkey-label">${escapeHtml(_(k.label))}</span></button>`);
    btn.onclick = k.action;
    bar.appendChild(btn);
  });
  return bar;
}

// A scanner gun sends its terminating keystroke as Enter, same as a human hitting the Enter
// key - so on any screen with more than one input visible at once (a line-item list: Receive/
// Deconsolidate/Ship/Count Detail, all built from repeated ".line-row" blocks), Enter must
// commit the scanned field and move to the next one, not fire the screen's primary action
// with every other line still empty. Only F8 (a dedicated physical key on real RF hardware,
// distinct from Enter) always means "submit this screen".
function focusNextLineInput(current) {
  const inputs = Array.from(document.querySelectorAll(".line-row input, .line-row select"));
  const idx = inputs.indexOf(current);
  if (idx === -1 || idx === inputs.length - 1) { current.blur(); return; }
  inputs[idx + 1].focus();
  if (inputs[idx + 1].tagName === "INPUT") inputs[idx + 1].select();
}

document.addEventListener("keydown", (e) => {
  if (!state.loggedOn) return;
  if (e.target && e.target.tagName === "TEXTAREA") return;
  if (e.key === "Enter" && e.target && e.target.closest && e.target.closest(".line-row")) {
    e.preventDefault();
    focusNextLineInput(e.target);
    return;
  }
  const FN_MAP = {
    F3: goBack,
    F5: () => { const reload = VIEW_RELOAD[state.view]; if (reload) reload(); },
    F7: () => { if (state.view === "task-detail" && !state.exceptionCodesLoaded) openExceptionPicker(); },
    F8: primaryAction,
    Enter: primaryAction,
  };
  if (FN_MAP[e.key]) { e.preventDefault(); FN_MAP[e.key](); }
});

function breadcrumb() {
  const section = state.section && SECTIONS[state.section];
  if (!section) return null;
  const VIEW_LABEL = {
    section: null, tasks: "Tasks", "task-detail": "Task", receive: "Receive", "receive-detail": "Receive",
    ship: "Ship", "ship-detail": "Ship", pack: "Pack", move: "Move", count: "Count", "count-detail": "Count",
    quality: "Quality", "quality-detail": "Quality", hu: "Handling Units", "hu-create": "New Handling Unit", "hu-detail": "Handling Unit",
    load: "Load", "load-detail": "Load",
    decon: "Deconsolidate", "decon-detail": "Deconsolidate", vas: "VAS", "vas-detail": "VAS",

  };
  const leaf = VIEW_LABEL[state.view];
  return `${section.icon} ${escapeHtml(_(section.label))}${leaf ? " &rsaquo; " + escapeHtml(_(leaf)) : ""}`;
}

function renderHeader() {
  const crumb = breadcrumb();
  const resourceChip = state.resource
    ? `<span class="resource-chip">\u{1F4E1} ${escapeHtml(state.resource.name)}${state.resource.current_queue ? " &middot; " + escapeHtml(state.resource.current_queue) : ""}</span>`
    : "";
  const header = el(`
    <header>
      <div class="title-wrap">

        <div class="user">${escapeHtml(USER_FULLNAME)} ${resourceChip}</div>
      </div>

  `);

// ---------- Logon (EWM RF-style: confirm warehouse/resource/queue before the main menu) ----------
function renderLogonHeader() {
  return el(`
    <header class="logon-header">
      <div class="title-wrap">
        <div class="title">${_("WMS RF Logon")}</div>
        <div class="user">${escapeHtml(USER_FULLNAME)}</div>
      </div>
    </header>
  `);
}

function renderLogon() {
  const wrap = el(`<div class="logon-wrap"></div>`);
  if (!state.resourceLoaded) {
    wrap.appendChild(el(`<div class="empty">${_("Connecting to warehouse…")}</div>`));
    return wrap;
  }
  const card = el(`<div class="detail-section logon-card"></div>`);
  if (!state.resource) {
    card.appendChild(el(`<h3>${_("Log On")}</h3><div class="hint">${_("Pick the device you're using this shift.")}</div>`));
    if (!state.availableResources.length) {
      card.appendChild(el(`
        <div class="banner error">\u{1F512} ${_("No free WMS Resource is available for you to log on to. Ask your supervisor to configure one, or Kick whoever's still logged on to the one you need.")}</div>
      `));
    }
    state.availableResources.forEach((r) => {
      const b = el(`<button class="btn btn-secondary">\u{1F4E1} ${escapeHtml(r.resource_code)} (${escapeHtml(_(r.resource_type))}${r.warehouse ? " &middot; " + escapeHtml(r.warehouse) : ""})</button>`);
      b.onclick = () => pickResource(r.name);
      card.appendChild(b);
    });
    const retry = el(`<button class="btn btn-secondary">${_("Refresh")}</button>`);
    retry.onclick = openResourcePicker;
    card.appendChild(retry);
  } else {
    card.appendChild(el(`
      <div class="detail-grid">
        <div><div class="label">${_("User")}</div><div>${escapeHtml(USER_FULLNAME)}</div></div>
        <div><div class="label">${_("Resource")}</div><div>${escapeHtml(state.resource.name)}</div></div>
        <div><div class="label">${_("Warehouse")}</div><div>${escapeHtml(state.resource.warehouse || "-")}</div></div>
        <div><div class="label">${_("Queue")}</div><div>${escapeHtml(state.resource.current_queue ? state.resource.current_queue : _("Not joined"))}</div></div>
      </div>
    `));
  }
  wrap.appendChild(card);
  if (state.resource) {
    wrap.appendChild(renderQueueBar());
    wrap.appendChild(renderWorkCenterBar());
    const btn = el(`<button class="btn btn-primary">${_("Continue")}</button>`);
    btn.onclick = enterMenu;
    wrap.appendChild(btn);
  }
  return wrap;
}

function enterMenu() {
  setState({ loggedOn: true, view: "menu", error: null, info: null });
}

function renderMenu() {
  const wrap = el(`<div></div>`);
  const grid = el(`<div class="menu-grid"></div>`);
  const items = [
    ...Object.keys(SECTIONS).map((key) => ({ icon: SECTIONS[key].icon, label: SECTIONS[key].label, action: () => goSection(key) })),
    { icon: "\u{1F50D}", label: "Lookup", action: () => setState({ view: "lookup", section: null, error: null, info: null }) },
  ];
  items.forEach((item) => {
    const btn = el(`
      <div class="menu-btn">
        <span class="icon">${item.icon}</span>${escapeHtml(_(item.label))}
      </div>
    `);
    btn.onclick = item.action;
    grid.appendChild(btn);
  });
  wrap.appendChild(grid);
  return wrap;
}

function renderSection() {
  const section = SECTIONS[state.section];
  const wrap = el(`<div></div>`);
  if (!section) { goHome(); return wrap; }
  const grid = el(`<div class="menu-grid"></div>`);
  section.items.forEach((item) => {
    const groupTasks = item.taskGroup ? state.tasks.filter((t) => TASK_TYPE_GROUPS[item.taskGroup].includes(t.task_type)) : [];
    const activeCount = groupTasks.filter((t) => t.status !== "On Hold").length;
    const holdCount = groupTasks.filter((t) => t.status === "On Hold").length;
    const btn = el(`
      <div class="menu-btn">
        <span class="icon">${item.icon}</span>${escapeHtml(_(item.label))}
        <div>
          ${activeCount ? `<span class="count">${activeCount}</span>` : ""}
          ${holdCount ? `<span class="count" style="background:var(--panel-2); color:var(--muted); margin-left:4px;">\u{1F512}${holdCount}</span>` : ""}
        </div>
      </div>
    `);
    btn.onclick = item.action;
    grid.appendChild(btn);
  });
  wrap.appendChild(grid);
  return wrap;
}

// ----- Tasks -----
function taskCard(task) {
  const onHold = task.status === "On Hold";
  const card = el(`
    <div class="card ${onHold ? "card-blocked" : ""}">
      <div class="row1">
        <div class="task-type">${escapeHtml(_(task.task_type))}</div>
        <div>${statusBadgeHtml(task.status)}<span class="badge ${escapeHtml(task.priority)}">${escapeHtml(_(task.priority))}</span></div>
      </div>
      <div class="meta">
        ${escapeHtml(task.product || "")}<br>
        ${escapeHtml(task.source_bin || task.source_hu || "-")} &rarr; ${escapeHtml(task.destination_bin || task.destination_hu || "-")}
        ${onHold ? `<br><span class="blocked-reason">${escapeHtml(task.blocking_reason || _("Waiting on an earlier task in this Warehouse Order"))}</span>` : ""}
      </div>
      <div class="qty">${task.confirmed_quantity || 0} / ${task.planned_quantity} ${escapeHtml(task.stock_uom || "")}${task.wave ? " &middot; " + escapeHtml(task.wave) : ""}</div>
    </div>
  `);
  card.onclick = () => openTask(task);
  return card;
}

function renderQueueBar() {
  const bar = el(`<div class="detail-section"></div>`);
  const resource = state.resource;
  const queue = resource && resource.current_queue;
  bar.appendChild(el(`<h3>${_("Queue")}</h3>`));
  const resourceRow = el(`<div class="row1"></div>`);
  resourceRow.appendChild(el(`<div>\u{1F4E1} ${escapeHtml(resource ? resource.name : "")}</div>`));
  const logOffBtn = el(`<button class="btn btn-secondary">${_("Log Off")}</button>`);
  logOffBtn.onclick = () => { if (confirm(_("Log off this device?"))) doLogOff(); };
  resourceRow.appendChild(logOffBtn);
  bar.appendChild(resourceRow);
  const row = el(`<div class="row1"></div>`);
  row.appendChild(el(`<div>${queue ? "\u{1F4E1} " + escapeHtml(queue) : _("Not joined to a queue")}</div>`));
  const actions = el(`<div></div>`);
  if (queue) {
    const pullBtn = el(`<button class="btn btn-secondary">${_("Get Work")}</button>`);
    pullBtn.onclick = pullWork;
    actions.appendChild(pullBtn);
    const leaveBtn = el(`<button class="btn btn-secondary">${_("Leave")}</button>`);
    leaveBtn.onclick = leaveCurrentQueue;
    actions.appendChild(leaveBtn);
  } else {
    const joinBtn = el(`<button class="btn btn-primary">${_("Join Queue")}</button>`);
    joinBtn.onclick = openQueuePicker;
    actions.appendChild(joinBtn);
  }
  row.appendChild(actions);
  bar.appendChild(row);

  if (state.showQueuePicker) {
    if (!state.availableQueues.length) {
      bar.appendChild(el(`<div class="hint">${_("No queues configured for your warehouse.")}</div>`));
    }
    state.availableQueues.forEach((q) => {
      const b = el(`<button class="btn btn-secondary">${escapeHtml(q.queue_name)} (${escapeHtml(_(q.activity))})</button>`);
      b.onclick = () => pickQueue(q.name);
      bar.appendChild(b);
    });
    const cancel = el(`<button class="btn btn-secondary">${_("Cancel")}</button>`);
    cancel.onclick = () => setState({ showQueuePicker: false });
    bar.appendChild(cancel);
  }
  return bar;
}

// Fully optional - most actions never touch this. Only VAS/Packing/Kitting screens (the ones
// that already carry a work_center_bin) read it, to default that field instead of requiring
// a scan every time; an operator who never logs on to one just keeps scanning as before.
function renderWorkCenterBar() {
  const bar = el(`<div class="detail-section"></div>`);
  const resource = state.resource;
  const workCenter = resource && resource.current_work_center;
  bar.appendChild(el(`<h3>${_("Work Center")}</h3>`));
  const row = el(`<div class="row1"></div>`);
  row.appendChild(el(`<div>${workCenter ? "\u{1F3ED} " + escapeHtml(workCenter) : _("Not logged on to a Work Center (optional)")}</div>`));
  const actions = el(`<div></div>`);
  if (workCenter) {
    const leaveBtn = el(`<button class="btn btn-secondary">${_("Leave")}</button>`);
    leaveBtn.onclick = leaveCurrentWorkCenter;
    actions.appendChild(leaveBtn);
  } else {
    const joinBtn = el(`<button class="btn btn-secondary">${_("Log On to Work Center")}</button>`);
    joinBtn.onclick = openWorkCenterPicker;
    actions.appendChild(joinBtn);
  }
  row.appendChild(actions);
  bar.appendChild(row);

  if (state.showWorkCenterPicker) {
    if (!state.availableWorkCenters.length) {
      bar.appendChild(el(`<div class="hint">${_("No Work Centers configured for your warehouse.")}</div>`));
    }
    state.availableWorkCenters.forEach((wc) => {
      const b = el(`<button class="btn btn-secondary">${escapeHtml(wc.work_center_name || wc.work_center_code)} (${escapeHtml(wc.bin)})</button>`);
      b.onclick = () => pickWorkCenter(wc.name);
      bar.appendChild(b);
    });
    const cancel = el(`<button class="btn btn-secondary">${_("Cancel")}</button>`);
    cancel.onclick = () => setState({ showWorkCenterPicker: false });
    bar.appendChild(cancel);
  }
  return bar;
}

function renderTasks() {
  const wrap = el(`<div></div>`);
  if (state.resource) { wrap.appendChild(renderQueueBar()); wrap.appendChild(renderWorkCenterBar()); }
  if (!state.tasks.length && !state.loading) {
    wrap.appendChild(el(`<div class="empty">${_("No open tasks right now.")}</div>`));
    return wrap;
  }
  const groups = [];
  const groupByWO = {};
  state.tasks.forEach((task) => {
    if (!task.warehouse_order) { groups.push({ wo: null, tasks: [task] }); return; }
    if (!groupByWO[task.warehouse_order]) {
      const group = { wo: task.warehouse_order, tasks: [] };
      groupByWO[task.warehouse_order] = group;
      groups.push(group);
    }
    groupByWO[task.warehouse_order].tasks.push(task);
  });
  groups.forEach((group) => {
    if (!group.wo) { wrap.appendChild(taskCard(group.tasks[0])); return; }
    const sorted = [...group.tasks].sort((a, b) => (a.sequence || 0) - (b.sequence || 0));
    const confirmed = sorted.filter((t) => t.status === "Confirmed").length;
    const section = el(`<div class="detail-section"><h3>${escapeHtml(group.wo)} &middot; ${_("{0}/{1} confirmed", [confirmed, sorted.length])}</h3></div>`);
    const timeline = el(`<div class="timeline"></div>`);
    sorted.forEach((task, idx) => {
      const dotState = task.status === "Confirmed" ? "done" : task.status === "On Hold" ? "pending" : "active";
      const row = el(`<div class="timeline-row"><div class="timeline-dot ${dotState}">${idx + 1}</div></div>`);
      const cardWrap = el(`<div class="timeline-card"></div>`);
      cardWrap.appendChild(taskCard(task));
      row.appendChild(cardWrap);
      timeline.appendChild(row);
    });
    section.appendChild(timeline);
    wrap.appendChild(section);
  });
  return wrap;
}

function renderTaskDetail() {
  const task = state.currentTask;
  const wrap = el(`<div></div>`);

  wrap.appendChild(el(`
    <div class="detail-section">
      <h3>${escapeHtml(_(task.task_type))} &middot; ${escapeHtml(_(task.priority))} ${statusBadgeHtml(task.status)}</h3>
      <div class="detail-grid">
        <div><div class="label">${_("Product")}</div><div>${escapeHtml(task.product || "-")}</div></div>
        <div><div class="label">${_("Planned")}</div><div>${task.planned_quantity} ${escapeHtml(task.stock_uom || "")}</div></div>
        <div><div class="label">${_("Source")}</div><div>${escapeHtml(task.source_bin || "-")}${task.source_hu ? " / " + escapeHtml(task.source_hu) : ""}</div></div>
        <div><div class="label">${_("Destination")}</div><div>${escapeHtml(task.destination_bin || "-")}${task.destination_hu ? " / " + escapeHtml(task.destination_hu) : ""}</div></div>
      </div>
    </div>
  `));

  if ((task.stock_allocations || []).length > 1) {
    const breakdown = el(`<div class="detail-section"><h3>${_("Cluster pick - sort into {0} orders", [task.stock_allocations.length])}</h3></div>`);
    task.stock_allocations.forEach((row) => {
      breakdown.appendChild(el(`
        <div class="line-sub">${escapeHtml(row.outbound_delivery_number || row.outbound_delivery || row.stock_allocation)} &middot; ${row.allocated_quantity} ${escapeHtml(task.stock_uom || "")}</div>
      `));
    });
    wrap.appendChild(breakdown);
  }

  if (task.status === "On Hold") {
    wrap.appendChild(el(`
      <div class="detail-section">
        <div class="banner error" style="margin-bottom:0;">
          \u{1F512} ${escapeHtml(task.blocking_reason || _("Waiting on an earlier task in this Warehouse Order."))}
        </div>
      </div>
    `));
    return wrap;
  }

  if (state.exceptionCodesLoaded && state.exceptionSelectedCode) {
    const code = state.exceptionCodes.find((c) => c.name === state.exceptionSelectedCode);
    const qtySection = el(`
      <div class="detail-section">
        <h3>${escapeHtml(code.exception_name)}</h3>
        <div class="hint">${_("Enter the quantity actually found. The task closes at this amount and the shortfall raises a replenishment request.")}</div>
        <div class="field"><label>${_("Quantity found")}</label><input type="number" inputmode="decimal" value="${escapeHtml(state.exceptionRevisedQty)}" autofocus></div>
      </div>
    `);
    qtySection.querySelector("input").oninput = (e) => { state.exceptionRevisedQty = e.target.value; };
    if (code.requires_comment) {
      const field = el(`
        <div class="field">
          <label>${_("Comment (required for this exception)")}</label>
          <input type="text" placeholder="${_("What happened?")}" value="${escapeHtml(state.exceptionRemarks)}">
        </div>
      `);
      field.querySelector("input").oninput = (e) => { state.exceptionRemarks = e.target.value; };
      qtySection.appendChild(field);
    }
    const submitBtn = el(`<button class="btn btn-danger">${_("Report exception")}</button>`);
    submitBtn.onclick = () => submitException(code.name, state.exceptionRevisedQty);
    qtySection.appendChild(submitBtn);
    const back = el(`<button class="btn btn-secondary">${_("Back")}</button>`);
    back.onclick = () => setState({ exceptionSelectedCode: null, exceptionRevisedQty: "" });
    qtySection.appendChild(back);
    wrap.appendChild(qtySection);
    return wrap;
  }

  if (state.exceptionCodesLoaded) {
    const excSection = el(`<div class="detail-section"><h3>${_("Select exception")}</h3></div>`);
    if (!state.exceptionCodes.length) {
      excSection.appendChild(el(`<div class="hint">${_("No exception codes are configured for this task type. Ask a supervisor to set one up under WMS Exception Code.")}</div>`));
    }
    state.exceptionCodes.forEach((code) => {
      const b = el(`<button class="btn btn-danger">${escapeHtml(code.exception_name)}${code.requires_supervisor ? " \u{1F512}" : ""}</button>`);
      b.onclick = () => selectExceptionCode(code.name);
      excSection.appendChild(b);
    });
    if (state.exceptionCodes.some((c) => c.requires_comment && !c.allows_quantity_change)) {
      const field = el(`
        <div class="field">
          <label>${_("Comment (required for some exceptions)")}</label>
          <input type="text" placeholder="${_("What happened?")}" value="${escapeHtml(state.exceptionRemarks)}">
        </div>
      `);
      field.querySelector("input").oninput = (e) => { state.exceptionRemarks = e.target.value; };
      excSection.appendChild(field);
    }
    const cancel = el(`<button class="btn btn-secondary">${_("Back")}</button>`);
    cancel.onclick = () => setState({ exceptionCodes: [], exceptionCodesLoaded: false, exceptionRemarks: "" });
    excSection.appendChild(cancel);
    wrap.appendChild(excSection);
    return wrap;
  }

  const steps = state.taskSteps;
  const stepKey = steps[state.taskStep];
  const remaining = flt(task.planned_quantity) - flt(task.confirmed_quantity);

  const dots = el(`<div class="step-dots"></div>`);
  steps.forEach((_s, i) => dots.appendChild(el(`<div class="dot ${i < state.taskStep ? "done" : i === state.taskStep ? "active" : ""}"></div>`)));
  wrap.appendChild(dots);

  const section = el(`<div class="detail-section"></div>`);
  const STEP_LABEL = { source: _("Scan source"), quantity: _("Quantity"), destination: _("Scan destination"), hu: _("Destination Handling Unit"), review: _("Review & confirm") };
  section.appendChild(el(`<div class="step-label">${_("Step {0} of {1}", [state.taskStep + 1, steps.length])} &middot; ${STEP_LABEL[stepKey]}</div>`));

  if (stepKey === "source") {
    const expected = [task.source_bin, task.source_hu].filter(Boolean).join(" or ");
    section.appendChild(el(`
      <div class="field">
        <label>${_("Expecting: {0}", [expected])}</label>
        <input type="text" id="scan-source" placeholder="${_("Scan bin or HU barcode")}" value="${escapeHtml(state.scanSource)}" autofocus>
        ${state.stepError ? `<div class="field-error">${escapeHtml(state.stepError)}</div>` : ""}
      </div>
    `));
    section.querySelector("input").oninput = (e) => { state.scanSource = e.target.value; };
  } else if (stepKey === "quantity") {
    section.appendChild(el(`
      <div class="field">
        <label>${_("Confirmed quantity &middot; remaining {0} {1}", [remaining, escapeHtml(task.stock_uom || "")])}</label>
        <input type="number" inputmode="decimal" id="confirm-qty" value="${escapeHtml(state.confirmQty)}">
        ${state.stepError ? `<div class="field-error">${escapeHtml(state.stepError)}</div>` : ""}
      </div>
    `));
    section.querySelector("input").oninput = (e) => { state.confirmQty = e.target.value; };
  } else if (stepKey === "destination") {
    const expected = [task.destination_bin, task.destination_hu].filter(Boolean).join(" or ");
    section.appendChild(el(`
      <div class="field">
        <label>${_("Expecting: {0}", [expected])}</label>
        <input type="text" id="scan-destination" placeholder="${_("Scan bin or HU barcode")}" value="${escapeHtml(state.scanDestination)}">
        ${state.stepError ? `<div class="field-error">${escapeHtml(state.stepError)}</div>` : ""}
      </div>
    `));
    section.querySelector("input").oninput = (e) => { state.scanDestination = e.target.value; };
  } else if (stepKey === "hu") {
    section.appendChild(el(`
      <div class="field">
        <label>${_("Destination Handling Unit (optional)")}</label>
        <input type="text" id="destination-hu" placeholder="${_("Scan or leave as suggested")}" value="${escapeHtml(state.destinationHu)}">
        <div class="hint">${_("Defaults to {0} if left as is.", [escapeHtml(task.destination_hu || task.source_hu || _("no HU"))])}</div>
      </div>
    `));
    section.querySelector("input").oninput = (e) => { state.destinationHu = e.target.value; };
  } else if (stepKey === "review") {
    section.appendChild(el(`
      <div class="detail-grid">
        <div><div class="label">${_("From")}</div><div>${escapeHtml(state.scanSource || task.source_bin || task.source_hu || "-")}</div></div>
        <div><div class="label">${_("To")}</div><div>${escapeHtml(state.scanDestination || task.destination_bin || task.destination_hu || "-")}</div></div>
        <div><div class="label">${_("Quantity")}</div><div>${escapeHtml(state.confirmQty)} ${escapeHtml(task.stock_uom || "")}</div></div>
        <div><div class="label">${_("Destination HU")}</div><div>${escapeHtml(state.destinationHu || task.destination_hu || task.source_hu || "-")}</div></div>
      </div>
    `));
  }
  wrap.appendChild(section);

  const nav = el(`<div style="display:flex; gap:10px;"></div>`);
  if (state.taskStep > 0) {
    const back = el(`<button class="btn btn-secondary" style="flex:1;">${_("Back")}</button>`);
    back.onclick = () => goTaskStep(-1);
    nav.appendChild(back);
  }
  if (stepKey === "review") {
    const confirmBtn = el(`<button class="btn btn-primary" style="flex:2;">${_("Confirm")}</button>`);
    confirmBtn.onclick = confirmCurrentTask;
    nav.appendChild(confirmBtn);
  } else {
    const next = el(`<button class="btn btn-primary" style="flex:2;">${_("Next")}</button>`);
    next.onclick = () => goTaskStep(1);
    nav.appendChild(next);
  }
  wrap.appendChild(nav);

  const excBtn = el(`<button class="btn btn-danger">${_("Report exception")}</button>`);
  excBtn.onclick = openExceptionPicker;
  wrap.appendChild(excBtn);

  return wrap;
}

// ----- Lookup -----
function renderLookup() {
  const wrap = el(`<div></div>`);
  const form = el(`<div class="detail-section"></div>`);
  form.appendChild(el(`
    <div class="field">
      <label>${_("Type")}</label>
      <select id="lookup-type">
        <option value="hu" ${state.lookupType === "hu" ? "selected" : ""}>${_("Handling Unit")}</option>
        <option value="bin" ${state.lookupType === "bin" ? "selected" : ""}>${_("Storage Bin")}</option>
      </select>
    </div>
  `));
  form.appendChild(el(`
    <div class="field">
      <label>${_("Barcode")}</label>
      <input type="text" id="lookup-code" placeholder="${_("Scan or type a code")}" value="${escapeHtml(state.lookupCode)}">
    </div>
  `));
  wrap.appendChild(form);

  const goBtn = el(`<button class="btn btn-primary">${_("Look up")}</button>`);
  goBtn.onclick = () => {
    state.lookupType = document.getElementById("lookup-type").value;
    state.lookupCode = document.getElementById("lookup-code").value;
    runLookup();
  };
  wrap.appendChild(goBtn);

  if (state.lookupResult) wrap.appendChild(renderLookupResult());
  return wrap;
}

function renderLookupResult() {
  const r = state.lookupResult;
  const section = el(`<div class="detail-section"><h3>${_("Stock")}</h3></div>`);
  if (!r.stock || !r.stock.length) {
    section.appendChild(el(`<div class="empty">${_("No stock found.")}</div>`));
    return section;
  }
  const table = el(`
    <table class="result">
      <thead><tr><th>${_("Product")}</th><th>${_("Qty")}</th><th>${state.lookupType === "hu" ? _("Bin") : _("HU")}</th><th>${_("Stock type")}</th></tr></thead>
      <tbody></tbody>
    </table>
  `);

// ----- Move -----
function moveField(key, label, opts) {
  opts = opts || {};
  const f = state.moveForm;
  const type = key === "quantity" ? "number" : "text";
  const field = el(`
    <div class="field"><label>${escapeHtml(_(label))}</label>
      <input type="${type}" inputmode="${type === "number" ? "decimal" : "text"}" value="${escapeHtml(f[key])}" placeholder="${escapeHtml(opts.placeholder ? _(opts.placeholder) : "")}">
    </div>
  `);
  field.querySelector("input").oninput = (e) => { state.moveForm[key] = e.target.value; };
  return field;
}

function renderMove() {
  const wrap = el(`<div></div>`);
  const stepKey = MOVE_STEPS[state.moveStep];
  const f = state.moveForm;

  const dots = el(`<div class="step-dots"></div>`);
  MOVE_STEPS.forEach((_s, i) => dots.appendChild(el(`<div class="dot ${i < state.moveStep ? "done" : i === state.moveStep ? "active" : ""}"></div>`)));
  wrap.appendChild(dots);

  const STEP_LABEL = { item: _("Item"), quantity: _("Quantity"), source: _("Scan source"), destination: _("Scan destination"), review: _("Review & move") };
  const section = el(`<div class="detail-section"></div>`);
  section.appendChild(el(`<div class="step-label">${_("Step {0} of {1}", [state.moveStep + 1, MOVE_STEPS.length])} &middot; ${STEP_LABEL[stepKey]}</div>`));

  if (stepKey === "item") {
    section.appendChild(moveField("product", "Product"));
    section.appendChild(moveField("stock_uom", "UOM"));
    section.appendChild(moveField("stock_type", "Stock Type"));
  } else if (stepKey === "quantity") {
    section.appendChild(moveField("quantity", "Quantity"));
  } else if (stepKey === "source") {
    section.appendChild(moveField("source_bin", "Source Bin", { placeholder: "Scan bin barcode" }));
    section.appendChild(moveField("source_hu", "Source HU (optional)", { placeholder: "Scan HU barcode" }));
  } else if (stepKey === "destination") {
    section.appendChild(moveField("destination_bin", "Destination Bin", { placeholder: "Scan bin barcode" }));
    section.appendChild(moveField("destination_hu", "Destination HU (optional)", { placeholder: "Scan HU barcode" }));
  } else if (stepKey === "review") {
    section.appendChild(el(`
      <div class="detail-grid">
        <div><div class="label">${_("Product")}</div><div>${escapeHtml(f.product)} &middot; ${escapeHtml(f.quantity)} ${escapeHtml(f.stock_uom)}</div></div>
        <div><div class="label">${_("Stock type")}</div><div>${escapeHtml(_(f.stock_type))}</div></div>
        <div><div class="label">${_("From")}</div><div>${escapeHtml(f.source_bin || f.source_hu || "-")}</div></div>
        <div><div class="label">${_("To")}</div><div>${escapeHtml(f.destination_bin)}${f.destination_hu ? " / " + escapeHtml(f.destination_hu) : ""}</div></div>
      </div>
    `));
  }
  if (state.moveStepError) section.appendChild(el(`<div class="field-error">${escapeHtml(state.moveStepError)}</div>`));
  wrap.appendChild(section);

  const nav = el(`<div style="display:flex; gap:10px;"></div>`);
  if (state.moveStep > 0) {
    const back = el(`<button class="btn btn-secondary" style="flex:1;">${_("Back")}</button>`);
    back.onclick = () => goMoveStep(-1);
    nav.appendChild(back);
  }
  if (stepKey === "review") {
    const moveBtn = el(`<button class="btn btn-primary" style="flex:2;">${_("Move")}</button>`);
    moveBtn.onclick = submitMove;
    nav.appendChild(moveBtn);
  } else {
    const next = el(`<button class="btn btn-primary" style="flex:2;">${_("Next")}</button>`);
    next.onclick = () => goMoveStep(1);
    nav.appendChild(next);
  }
  wrap.appendChild(nav);
  return wrap;
}

    const row = el(`
      <div class="card">
        <div class="row1"><div class="task-type">${escapeHtml(h.handling_unit)}</div><span class="badge ${h.loaded ? "Normal" : "High"}">${h.loaded ? _("Loaded") : _("Pending")}</span></div>
      </div>
    `);
    if (!h.loaded) row.onclick = () => confirmHULoaded(h.handling_unit);
    list.appendChild(row);
  });
  wrap.appendChild(list);
  if (shipment.status === "Loaded") {
    const departBtn = el(`<button class="btn btn-primary">${_("Depart")}</button>`);
    departBtn.onclick = departCurrentShipment;
    wrap.appendChild(departBtn);
  }
  const backBtn = el(`<button class="btn btn-secondary">${_("Back to Shipments")}</button>`);
  backBtn.onclick = loadShipments;
  wrap.appendChild(backBtn);
  return wrap;
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}
function frappeEscapeAttr(s) { return escapeHtml(s); }

render();
loadResource();
</script>
</body>
</html>
