<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WMS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0d12">
<meta name="color-scheme" content="dark light">
<title>{{ _("WMS Scanner") }}</title>
<link rel="stylesheet" href="{{ css_url }}">
<script type="importmap">{{ import_map }}</script>
</head>
<body>
<div id="app">
  <div id="boot" class="boot">
    <div class="spinner"></div>
    <div id="boot-msg">{{ _("Starting scanner…") }}</div>
  </div>
</div>
<script>window.WMS = {{ boot }};</script>
<script>
// If the app never finishes starting (old browser without import maps, blocked script, dead network), say so instead of
// leaving a blank screen.
(function () {
  var supportsMap = window.HTMLScriptElement && HTMLScriptElement.supports && HTMLScriptElement.supports("importmap");
  function fail(msg) {
    var box = document.getElementById("boot");
    if (!box || window.WMS_BOOTED) return;
    box.innerHTML = "";
    var p = document.createElement("p"); p.textContent = msg; box.appendChild(p);
    var b = document.createElement("button"); b.className = "btn btn-primary"; b.textContent = "{{ _('Reload') }}";
    b.onclick = function () { location.reload(); }; box.appendChild(b);
  }
  if (supportsMap === false) { fail("{{ _('This browser is too old for the scanner app. Update iOS / your browser and reload.') }}"); return; }
  setTimeout(function () { fail("{{ _('The scanner app did not start. Check your connection and reload.') }}"); }, 12000);
  window.addEventListener("error", function (e) { if (!window.WMS_BOOTED) fail("{{ _('The scanner app failed to load.') }}"); });
})();
</script>
<script type="module" src="{{ entry_url }}"></script>
</body>
</html>
